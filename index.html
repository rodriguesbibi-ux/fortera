<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF6F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fortera Controle">
<title>Fortera Controle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF6F0; --surface:#FFFFFF; --surface2:#F5EFE7; --ink:#183243; --ink2:#566B7A; --line:#ECE3D8;
  --pj-bg:#234A63; --pj-fg:#FFFFFF; --pj-soft:#E6EDF1; --pf-bg:#94604A; --pf-fg:#FFFFFF; --pf-soft:#F8E9E0;
  --pri:#234A63; --on-pri:#FFFFFF; --sage:#A9B9A1; --sage-d:#4F6A4A; --terra:#E7A486; --terra-d:#8A5F4B; --terra-m:#C78D73;
  --pos:#4F6A4A; --neg:#A0553D; --logo-bg:transparent; --track:#ECE3D8;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1B23; --surface:#16262F; --surface2:#1D3340; --ink:#EDE6DD; --ink2:#9DB0BC; --line:#27404E;
    --pri:#A9B9A1; --on-pri:#0F1B23; --sage:#5E7457; --sage-d:#A9B9A1; --terra:#E7A486; --terra-d:#E7A486; --terra-m:#D9A088;
    --pos:#A9C79F; --neg:#E7A486; --logo-bg:#ECE3DA; --track:#27404E;
    --pj-bg:#A9B9A1; --pj-fg:#0F1B23; --pj-soft:#1D3340; --pf-bg:#E7A486; --pf-fg:#0F1B23; --pf-soft:#33261F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1B23; --surface:#16262F; --surface2:#1D3340; --ink:#EDE6DD; --ink2:#9DB0BC; --line:#27404E;
  --pri:#A9B9A1; --on-pri:#0F1B23; --sage:#5E7457; --sage-d:#A9B9A1; --terra:#E7A486; --terra-d:#E7A486; --terra-m:#D9A088;
  --pos:#A9C79F; --neg:#E7A486; --logo-bg:#ECE3DA; --track:#27404E;
  --pj-bg:#A9B9A1; --pj-fg:#0F1B23; --pj-soft:#1D3340; --pf-bg:#E7A486; --pf-fg:#0F1B23; --pf-soft:#33261F;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:400 16px/1.5 'Work Sans',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100%}
h1,h2,h3,h4{font-family:'Poppins','Work Sans',system-ui,sans-serif;margin:0;line-height:1.2;color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--pri)}
:focus-visible{outline:3px solid var(--terra);outline-offset:2px;border-radius:8px}
#app{max-width:560px;margin:0 auto;min-height:100vh;position:relative}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px}
.logo{height:38px;display:block;background:var(--logo-bg);border-radius:8px;padding:0}
:root[data-theme="dark"] .logo{padding:4px 8px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo{padding:4px 8px}}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
main{padding:8px 18px calc(96px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;font-size:11.5px;font-weight:500;color:var(--ink2)}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--pri);font-weight:600}
.tab[aria-current="page"] .ti{background:var(--pri);color:var(--on-pri)}
.ti{width:46px;height:28px;border-radius:14px;display:grid;place-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 1px 2px rgba(24,50,67,.04)}
.card.flat{background:transparent;border-style:dashed}
.h-page{font-size:26px;font-weight:600;margin:14px 0 6px;color:var(--ink)}
.h-page::after{content:"";display:block;width:46px;height:3px;border-radius:2px;background:var(--terra);margin-top:9px}
.sub{color:var(--ink2);font-size:15px;margin:0}
.h-card{font-size:17px;font-weight:600;margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:14px;background:var(--pri);color:var(--on-pri);font-weight:600;font-size:15.5px}
.btn.sec{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
.btn.block{width:100%}
.btn.small{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.link{color:var(--pri);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--ink2)}
.small{font-size:13.5px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--surface2);color:var(--ink2)}
.pill.ok{background:var(--sage);color:#183243}
.pill.warn{background:var(--terra-m);color:#183243}
.bar{height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--pri)}
.bar.terra>i{background:var(--terra-m)}
.bar.sage>i{background:var(--sage-d)}
.bar.neg>i{background:var(--neg)}
/* gauge */
.gauge{position:relative;width:100%;max-width:280px;margin:0 auto}
.gauge svg{width:100%;display:block}
.gauge .gnum{position:absolute;left:0;right:0;bottom:6px;text-align:center}
.gauge .gnum b{font:600 46px/1 'Poppins',sans-serif;color:var(--ink)}
.gauge .gnum span{display:block;font-size:13.5px;color:var(--ink2);margin-top:2px}
.lvl{font-family:'Poppins',sans-serif;font-weight:600;font-size:20px;text-align:center;margin-top:6px}
/* lists */
.item{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.item:last-child{border-bottom:0}
.num{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font:600 15px 'Poppins',sans-serif;background:var(--surface2);color:var(--ink)}
.num.done{background:var(--sage);color:#183243}
.chev{color:var(--ink2);flex:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:14px;padding:4px;gap:4px;margin:12px 0}
.seg button{min-height:40px;border-radius:11px;font-weight:600;font-size:13.5px;color:var(--ink2);padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* forms */
label.f{display:block;font-size:13.5px;font-weight:600;color:var(--ink2);margin:12px 0 5px}
.in{width:100%;min-height:46px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
.in:focus{border-color:var(--pri);outline:none}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .in{background:#FFFFFF}}
:root[data-theme="light"] .in{background:#FFFFFF}
select.in{appearance:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* diag */
.q{padding:14px 0;border-bottom:1px solid var(--line)}
.q:last-of-type{border-bottom:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{min-height:44px;border-radius:12px;border:1.5px solid var(--line);font-size:14px;font-weight:500;padding:6px 8px;background:var(--bg);line-height:1.2}
.opt[aria-pressed="true"]{background:var(--pri);color:var(--on-pri);border-color:var(--pri);font-weight:600}
/* finance */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi{border-top:4px solid var(--kc,var(--line))}
.kpi small{display:block;color:var(--ink2);font-size:12.5px;font-weight:600}
.kpi .ks{display:block;font-size:12px;font-style:italic;color:var(--ink2);margin-top:3px;line-height:1.3}
.kpi.wide2{grid-column:1/-1}
.kpi b{display:block;font:600 19px 'Poppins',sans-serif;margin-top:4px;word-break:break-word}
.kpi.wide{grid-column:1/-1;background:var(--pri);border-color:var(--pri)}
.kpi.wide small,.kpi.wide b,.kpi.wide .ks{color:var(--on-pri)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.fab{position:fixed;right:max(18px,calc((100vw - 560px)/2 + 18px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:15;min-height:52px;padding:0 20px;border-radius:26px;background:var(--pri);color:var(--on-pri);font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.22)}
.entry{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.date{width:44px;text-align:center;font-size:12.5px;font-weight:600;color:var(--ink2);flex:none;line-height:1.2}
.donut{width:120px;height:120px;border-radius:50%;flex:none;position:relative}
.donut::after{content:"";position:absolute;inset:26px;border-radius:50%;background:var(--surface)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,28,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-size:19px;margin-bottom:4px}
/* reader */
.rd-top{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.rd{padding:8px 20px calc(190px + env(safe-area-inset-bottom,0px))}
.rd h1{font-size:26px;font-weight:600;margin:18px 0 6px}
.rd h3{font-size:19px;margin:26px 0 6px;font-weight:600}
.blk{font-size:17.5px;line-height:1.7;padding:6px 10px;margin:2px -10px;border-radius:12px;cursor:pointer}
.blk.on{background:var(--surface2);box-shadow:inset 3px 0 0 var(--terra-m)}
.blk.step{display:flex;gap:12px}
.blk.step .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--pri);color:var(--on-pri);display:grid;place-items:center;font:600 13.5px 'Poppins',sans-serif;margin-top:5px}
.epi{font-style:italic;color:var(--ink2);margin-top:2px}
.mission{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--terra);border-radius:14px;padding:14px 16px;margin:18px 0 6px;font-size:17px;line-height:1.65;cursor:pointer}
.mission.on{background:var(--surface2)}
.mission b{font-family:'Poppins',sans-serif;display:block;margin-bottom:4px;font-size:15px}
.player{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;background:var(--surface);border-top:1px solid var(--line);padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));z-index:30;border-radius:20px 20px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.ctrl{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px}
.cbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface2)}
.cbtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cbtn.play{width:60px;height:60px;background:var(--pri)}
.cbtn.play{color:var(--on-pri)}
.cbtn.play svg{stroke:var(--on-pri);width:26px;height:26px}
.speed{min-width:58px;height:38px;border-radius:19px;background:var(--surface2);font-weight:600;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90%}
details.term{border-bottom:1px solid var(--line);padding:12px 2px}
details.term summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.term summary::-webkit-details-marker{display:none}
details.term summary::after{content:"+";color:var(--ink2);font-size:20px;line-height:1}
details.term[open] summary::after{content:"–"}
details.term p{margin:8px 0 0}
.formula{background:var(--surface2);border-left:4px solid var(--terra);padding:8px 12px;border-radius:8px;margin-top:8px;font-size:14.5px}
.disc{font-size:12.5px;color:var(--ink2);margin:18px 2px}

.card.pet{background:#234A63;border-color:#234A63;color:#fff}
.card.pet h2,.card.pet .h-card{color:#fff}
.card.pet .sub{color:rgba(255,255,255,.85)}
.card.pet .btn{background:#F8F3EC;color:#183243}
.card.terra{background:#E7A486;border-color:#E7A486;color:#183243}
.card.sage{background:#A9B9A1;border-color:#A9B9A1;color:#183243}
.card.terra h2,.card.sage h2,.card.terra .sub,.card.sage .sub{color:#183243}
.card.terra .muted,.card.sage .muted{color:#2F4453}
.card.terra .btn,.card.sage .btn{background:#183243;color:#fff}
.card.sage .bar{background:rgba(255,255,255,.55)}
.card.sage .bar>i{background:#183243}
.card.sage .link{color:#183243}
.card.pet .lvl{color:#fff}
.card.pet.modc{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}

[hidden]{display:none!important}
.mod-pj{--pri:var(--pj-bg);--on-pri:var(--pj-fg);--mod-soft:var(--pj-soft)}
.mod-pf{--pri:var(--pf-bg);--on-pri:var(--pf-fg);--mod-soft:var(--pf-soft)}
.modbanner{display:flex;gap:12px;align-items:center;background:var(--mod-soft);border-left:5px solid var(--pri);border-radius:14px;padding:11px 14px;margin:2px 0 12px}
.modbanner b{font-family:'Poppins',sans-serif;font-size:15px;display:block}
.seg .cb-pj[aria-pressed="true"]{background:var(--pj-bg);color:var(--pj-fg);box-shadow:none}
.seg .cb-pf[aria-pressed="true"]{background:var(--pf-bg);color:var(--pf-fg);box-shadow:none}
.tag{display:inline-block;background:var(--ink);color:var(--bg);font:700 11.5px 'Work Sans',sans-serif;letter-spacing:.06em;padding:4px 11px;border-radius:7px}
.card.acc{border-left:5px solid var(--terra)}
.stepper{display:flex;align-items:flex-start;justify-content:space-between;margin-top:14px}
.st{width:50px;display:flex;flex-direction:column;align-items:center;gap:7px;overflow:visible}
.sc{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--terra);display:grid;place-items:center;color:var(--ink);background:var(--surface)}
.st.on .sc{background:var(--sage);border-color:var(--sage);color:#183243}
.sl{font-size:10px;font-weight:600;color:var(--ink);text-align:center;line-height:1.2;white-space:nowrap}
.dots{flex:1;margin-top:22px;border-top:2px dotted var(--terra);min-width:4px}
.wf{margin:9px 0}
.wf .row{font-size:14px;gap:10px}.wf b{white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}

.chip{min-height:38px;padding:0 14px;border-radius:19px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--pri);color:var(--on-pri);border-color:var(--pri)}
.seg .cb-all[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.bdg-pj{background:var(--pj-soft);color:var(--pj-bg)}
.bdg-pf{background:var(--pf-soft);color:var(--pf-bg)}
.pill.bdg-pj,.pill.bdg-pf{font-weight:700}
.def{padding:9px 4px;margin:2px 0}
.def b{display:block;font-family:'Poppins',sans-serif;font-size:14.5px;color:var(--pri);margin-bottom:2px}
.def.on{background:var(--surface2);box-shadow:inset 3px 0 0 var(--terra-m);border-radius:10px;padding-left:10px}

details.collapse{cursor:default}
details.collapse summary{list-style:none;cursor:pointer}
details.collapse summary::-webkit-details-marker{display:none}
details.collapse summary::marker{content:''}
.chevicon{display:inline-flex;flex:none;color:inherit;opacity:.8;transition:transform .18s;transform:rotate(90deg)}
details.collapse[open] .chevicon{transform:rotate(-90deg)}
.empty{text-align:center;padding:22px 10px;color:var(--ink2)}
textarea.in{min-height:90px;padding:10px 14px;resize:vertical}
@media (prefers-reduced-motion:no-preference){.blk,.opt,.btn{transition:background .15s,border-color .15s}}

/* ===== Desktop layout ===== */
@media (min-width:900px){
  body{background:var(--surface2)}
  #app{max-width:none;margin:0;background:var(--bg)}
  .hdr{margin-left:228px;max-width:760px;padding:24px 32px 8px}
  main{margin-left:228px;max-width:760px;padding:8px 32px 90px}
  .tabbar{position:fixed;left:0;top:0;bottom:0;transform:none;width:228px;max-width:228px;height:100vh;
    display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:5px;
    padding:28px 14px calc(14px + env(safe-area-inset-bottom,0px));border-top:0;border-right:1px solid var(--line);z-index:25}
  .tab{flex-direction:row;justify-content:flex-start;gap:13px;padding:11px 14px;border-radius:12px;font-size:14.5px}
  .tab .ti{width:36px;height:30px;flex:none}
  .fab{left:auto;right:40px;transform:none}
  .player{left:228px;right:0;width:auto;max-width:none;transform:none;border-radius:0;padding-left:32px;padding-right:32px}
  .scrim{align-items:center}
  .sheet{border-radius:20px;max-width:640px;max-height:88vh;margin:0}
  .sheet .grid2{grid-template-columns:1fr 1fr}
  .rd-top{margin-left:228px;max-width:760px;padding-left:32px;padding-right:32px}
  .rd{margin-left:228px;max-width:760px;padding-left:32px;padding-right:32px;padding-bottom:150px}
  .kpis{grid-template-columns:repeat(3,1fr)}
  .kpi.wide,.kpi.wide2{grid-column:1/-1}
  .card{padding:22px}
}
@media (min-width:1180px){
  .hdr,main,.rd-top,.rd{max-width:880px}
  .sheet{max-width:720px}
}
</style>
</head>
<body>

<script type="module">
(async () => {
  const firebaseConfig = {
    apiKey: "AIzaSyBGWP4uu46MeKuWw28vsJqyS4NXQEGKmko",
    authDomain: "fortera-a1240.firebaseapp.com",
    projectId: "fortera-a1240",
    storageBucket: "fortera-a1240.firebasestorage.app",
    messagingSenderId: "1037196882138",
    appId: "1:1037196882138:web:0c660d61d76ed6e66575e3",
    measurementId: "G-B6T39B2308"
  };
  try{
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js");
    const { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js");
    const { getFirestore, doc, getDoc, setDoc, serverTimestamp } = await import("https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js");

    const fbApp = initializeApp(firebaseConfig);
    const fbAuth = getAuth(fbApp);
    const fbDb = getFirestore(fbApp);
    const fbProvider = new GoogleAuthProvider();

    window.FB = {
      signIn: () => signInWithPopup(fbAuth, fbProvider),
      signOutUser: () => signOut(fbAuth),
      onAuth: (cb) => onAuthStateChanged(fbAuth, cb),
      checkAuthorized: async (email) => {
        const snap = await getDoc(doc(fbDb, 'autorizados', (email||'').toLowerCase()));
        return snap.exists();
      },
      loadState: async (uid) => {
        const snap = await getDoc(doc(fbDb, 'usuarios', uid));
        return snap.exists() ? snap.data().state : null;
      },
      saveState: async (uid, stateStr) => {
        return setDoc(doc(fbDb, 'usuarios', uid), {state: stateStr, updatedAt: serverTimestamp()});
      }
    };
  }catch(e){
    window.FB = null;
    console.error('Falha ao iniciar Firebase', e);
  }finally{
    window.dispatchEvent(new Event('fb-ready'));
  }
})();
</script>

const OPTS=['Nunca / raramente','Às vezes','Quase sempre','Sempre'];
const LEVELS=[
 {max:15,n:'Nível Caótico',c:'var(--terra-d)',rec:`As finanças do seu negócio ainda vivem mais na cabeça e no extrato bancário do que num controle de verdade. Isso é mais comum do que parece e é exatamente o ponto de partida de muitos empreendedores e pequenos empresários. O primeiro passo é simples: separar o que é seu do que é da empresa e começar a enxergar os números com clareza.`,cta:`Comece pelo básico: organize sua planilha de orçamento e agende um diagnóstico com a Fortera para sair do zero com um plano.`},
 {max:30,n:'Nível Em Construção',c:'var(--terra-m)',rec:`Você já deu passos importantes: existe algum controle, alguma separação, algum planejamento. Mas ainda falta consistência. Os números aparecem, mas nem sempre orientam suas decisões. Com uma estrutura definida (orçamento, fluxo de caixa e metas claras), seu negócio ganha previsibilidade rapidamente.`,cta:`Este é o momento ideal para estruturar de vez: conheça a consultoria financeira da Fortera e monte, com acompanhamento, o controle que ainda falta.`},
 {max:45,n:'Nível Estruturado',c:'var(--sage-d)',rec:`Parabéns! Seu negócio já tem uma base financeira sólida: você controla, planeja e entende seus números. A partir daqui o ganho está em refinar: otimizar margem, revisar precificação e planejar o próximo salto de crescimento com mais estratégia.`,cta:`Leve sua gestão financeira para o próximo nível com um planejamento estratégico personalizado da Fortera Consultoria.`}
];
