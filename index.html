const GUIDES=[
 {id:0,t:`Introdução`,sub:`Comece por aqui`,b:[
  ['p',`Este guia foi feito para você que empreende ou tem um pequeno negócio e sente que as finanças ainda estão mais na cabeça, ou no extrato bancário, do que num controle de verdade. Ele traz 9 passos práticos: os 5 pilares avaliados no Raio-X Financeiro do Empreendedor, o checklist de autodiagnóstico da Fortera Consultoria, e mais 4 capítulos avançados (DRE simplificada, ponto de equilíbrio, painel de indicadores e o hábito da gestão financeira) que aprofundam a leitura do resultado do negócio e ajudam a sustentar tudo isso no dia a dia, na empresa e na vida pessoal.`],
  ['p',`Se você já respondeu o checklist, use este guia como plano de ação: comece pelo capítulo que corresponde à seção onde a sua pontuação foi mais baixa. Se ainda não respondeu, vale a pena fazer isso antes. Leva menos de 10 minutos e ajuda a enxergar por onde começar. Os capítulos 6 a 9 valem para qualquer nível, e fazem mais sentido depois de os cinco primeiros já estarem rodando na rotina do negócio.`],
  ['p',`Nenhum passo aqui exige sistemas caros ou conhecimento técnico avançado. Só clareza, alguma disciplina e a disposição de olhar para os números com honestidade.`],
  ['h',`Como usar este guia`],
  ['p',`Não tente aplicar tudo de uma vez. Escolha um capítulo por semana e implemente de verdade antes de seguir para o próximo. Consistência vale mais que velocidade.`]]},

 {id:1,sec:0,t:`Separação entre Pessoal e Empresarial`,sub:`Capítulo 1`,b:[
  ['e',`Antes de qualquer planilha ou controle, existe uma decisão que muda tudo: tratar o dinheiro do negócio como algo separado do seu dinheiro pessoal. Sem isso, nenhum número que você olhar depois vai refletir a realidade.`],
  ['h',`Comece pelo seu porquê`],
  ['p',`A maioria dos empreendedores responde rápido o que o negócio vende e como ele funciona no dia a dia. A pergunta que costuma travar é por que aquele negócio existe, além de "para pagar as contas". Parece filosófica, mas tem uma consequência bem prática nas finanças: se o motivo de você ter aberto o negócio foi construir segurança e liberdade para a sua vida e, em muitos casos, para a sua família, então misturar as contas do negócio com sua conta pessoal é, na prática, misturar dois objetivos diferentes dentro do mesmo bolso.`],
  ['p',`Quando esses dois objetivos não estão separados no dinheiro, também não estão separados na cabeça: fica quase impossível saber se é o negócio que está indo bem, ou se é a sua disposição pessoal de abrir mão de conforto para cobrir um buraco no caixa da empresa (ou o contrário, o negócio sustentando gastos pessoais que ele ainda não deveria sustentar). Separar as contas é o primeiro passo prático para conseguir medir, de verdade, se o seu "porquê" está sendo sustentado pelo negócio, ou se está sendo sustentado à custa dele.`],
  ['h',`Se o negócio é seu, ou de vocês dois`],
  ['p',`Se você empreende sozinho(a) mas divide a vida financeira com um parceiro(a), a separação entre pessoal e empresarial ganha uma camada extra: alinhar não só "negócio x pessoal", mas também "meu x seu x nosso" dentro da parte pessoal. É comum que um dos dois carregue mais o peso emocional das oscilações do negócio, enquanto o outro sente os efeitos no orçamento da casa sem entender de onde vêm.`],
  ['p',`Uma prática simples, comum em quem estuda como casais constroem patrimônio juntos, é reservar uma conversa fixa (pode ser mensal) só para falar de dinheiro a dois: como está o pró-labore, o que mudou no negócio, o que isso significa para os planos da família. Não é sobre dividir tarefas no meio, é sobre garantir que os dois enxergam a mesma realidade financeira, mesmo que só um cuide do dia a dia do negócio.`],
  ['h',`Pró-labore: quanto tirar e quando`],
  ['p',`Pró-labore é a remuneração que você retira do negócio pelo seu trabalho: não é "o que sobra no fim do mês", é um valor definido com critério, como o negócio pagaria a um profissional contratado para a sua função. Para chegar a esse número, olhe o que o negócio sustenta de forma consistente nos últimos 6 meses (nem o melhor mês, nem o pior) e arredonde para um valor fixo, fácil de acompanhar.`],
  ['p',`Dois erros são comuns aqui. O primeiro é fixar um pró-labore alto demais, que obriga o negócio a sangrar caixa todo mês para sustentar um padrão pessoal que ele ainda não aguenta. O segundo, mais frequente, é não fixar nada: viver "sacando" da conta do negócio conforme a necessidade pessoal aparece. Esse segundo erro é, sozinho, o principal motivo pelo qual dono de negócio pequeno chega ao fim do ano sem saber, de fato, quanto ganhou.`],
  ['p',`Já o "quando" é sobre transformar a retirada em rotina: escolha uma data fixa no mês, como todo dia 5 ou logo depois de fechar o caixa do mês anterior, e transfira sempre nesse mesmo dia. Retirar em data certa, e não conforme o dinheiro parece disponível, é o que evita o saque por impulso.`],
  ['h',`O método Lucro Primeiro: inverta a lógica do que sobra`],
  ['p',`Uma forma prática de proteger o pró-labore e a margem do negócio, bastante discutida em livros de gestão financeira para pequenos negócios, é inverter a conta tradicional. A maioria dos negócios opera, sem perceber, pela fórmula Receita − Despesas = Lucro; o lucro é tratado como o que sobra depois de tudo. O problema é que, quando o lucro é o que sobra, ele quase sempre sobra pouco: as despesas têm o hábito de crescer até ocupar todo o espaço disponível.`],
  ['p',`A alternativa é inverter a ordem: Receita − Lucro (e pró-labore) = Despesas. Assim que uma receita entra, uma parte já é reservada como lucro e outra como pró-labore, antes de qualquer despesa ser paga, e o negócio aprende a operar com o que sobra depois dessas reservas, e não o contrário.`],
  ['p',`Um exemplo simplificado ajuda a visualizar a diferença, considerando um negócio que fatura R$ 20.000 no mês (o exemplo une pró-labore e lucro em uma única reserva, sem separar o pote de impostos):`],
  ['d',`Método tradicional (Receita − Despesas = Lucro)`,`Receita R$ 20.000; nada reservado antes; despesas R$ 17.000; resultado R$ 3.000, e variável mês a mês.`],
  ['d',`Método Lucro Primeiro (Receita − Lucro = Despesas)`,`Receita R$ 20.000; R$ 6.000 reservados primeiro; despesas R$ 14.000; resultado R$ 6.000, e garantido.`],
  ['p',`Uma forma simples de aplicar essa lógica, mesmo sem sistemas sofisticados, é separar o dinheiro que entra em contas (ou "potes") diferentes, logo na entrada: um percentual fixo para o pró-labore, outro para reserva de lucro, outro para os impostos (capítulo 4) e o restante para as despesas operacionais. Os percentuais exatos variam conforme o negócio, mas o princípio vale para qualquer tamanho de operação: separar antes de gastar, não depois.`],
  ['h',`Como colocar em prática`],
  ['s',`Abra uma conta bancária exclusiva para o negócio, mesmo como empreendedor individual ou MEI. Não precisa ser algo sofisticado, só precisa estar separada da sua conta pessoal.`],
  ['s',`Defina um valor fixo mensal de retirada (seu pró-labore), calculado com base no que o negócio sustenta de forma consistente, não no que sobrar no fim do mês.`],
  ['s',`Toda receita do negócio entra na conta do negócio; toda despesa pessoal sai da sua conta pessoal, mesmo que pareça mais prático misturar tudo no começo.`],
  ['s',`Se fizer sentido para o seu negócio, aplique a lógica do Lucro Primeiro: separe, assim que a receita entrar, os percentuais de pró-labore, lucro e impostos, antes de pagar qualquer despesa operacional.`],
  ['s',`Uma vez por mês, transfira o pró-labore da conta do negócio para a pessoal: esse é o único elo formal entre as duas contas.`],
  ['s',`Se divide a vida financeira com alguém, marque uma conversa fixa mensal sobre dinheiro a dois, incluindo o que muda no orçamento da casa por causa do negócio.`],
  ['m',`Se hoje você usa a mesma conta para tudo, comece pelas próximas contas a pagar: separe o que é claramente pessoal do que é claramente do negócio. Não precisa ser perfeito já no primeiro mês.`]]},

 {id:2,sec:1,t:`Controle de Entradas e Saídas (Fluxo de Caixa)`,sub:`Capítulo 2`,b:[
  ['e',`Fluxo de caixa não é sobre prever o futuro. É sobre saber, com precisão, o que já aconteceu e o que está prestes a acontecer com o seu dinheiro.`],
  ['h',`Fluxo de caixa não é "quanto eu lucrei"`],
  ['p',`É comum confundir fluxo de caixa com lucro, mas são coisas diferentes. Fluxo de caixa é o dinheiro que efetivamente entrou e saiu da conta. Lucro é um cálculo contábil, que considera receitas e despesas no período a que pertencem, independente de quando o dinheiro muda de mãos de fato. Um negócio pode ter um mês de caixa apertado mesmo sendo lucrativo (por exemplo, se pagou um fornecedor à vista mas vai receber dos clientes só daqui a 60 dias), e o contrário também acontece.`],
  ['p',`Para o dia a dia da gestão, o fluxo de caixa vem primeiro: é ele que decide se você consegue pagar as contas deste mês. O lucro, tema do capítulo 5 deste guia, entra depois, para saber se o negócio faz sentido no médio prazo.`],
  ['h',`Como classificar suas despesas de verdade`],
  ['p',`Toda despesa do negócio pode ser olhada por dois ângulos que se complementam. O primeiro é fixo x variável: despesas fixas (aluguel, assinaturas, salários) acontecem todo mês, independente de quanto você vende; despesas variáveis (matéria-prima, comissões, frete) crescem e diminuem junto com o volume de vendas. O segundo ângulo é essencial x discricionário: dentro de fixas e variáveis, algumas despesas são indispensáveis para o negócio funcionar, e outras são escolhas, nem sempre erradas, mas escolhas que merecem ser revistas de tempos em tempos.`],
  ['p',`Classificar dessa forma muda a forma como você decide o que ajustar: cortar uma despesa fixa costuma exigir uma mudança estrutural (trocar de fornecedor, renegociar um contrato, cancelar uma assinatura), enquanto ajustar uma despesa variável é mais rápido, mas tem limite, porque ela normalmente acompanha a sua receita.`],
  ['h',`Como controlar as despesas da empresa, de verdade`],
  ['p',`Controlar despesas não é cortar tudo, é saber, de forma consciente, para onde cada real do negócio está indo, e decidir de propósito, não por inércia. Algumas práticas fazem diferença real:`],
  ['d',`Revise`,`assinaturas e contratos recorrentes a cada 3 a 6 meses. Ferramentas e planos contratados "para testar" costumam continuar sendo cobrados muito depois de deixarem de ser usados.`],
  ['d',`Desconfie`,`das despesas pequenas e frequentes. Um gasto de R$ 50 parece irrelevante isoladamente, mas multiplicado por 12 meses e por vários itens parecidos pode representar uma fatia real do resultado: o efeito "sapo fervendo", em que aumentos pequenos e graduais raramente disparam um alarme.`],
  ['d',`Compare`,`toda despesa relevante com o percentual da receita, não só com o valor absoluto. Uma despesa de R$ 2.000 é ótima quando o negócio fatura R$ 40.000, e preocupante quando fatura R$ 10.000; o que importa é a proporção, não o número isolado.`],
  ['d',`Negocie`,`com fornecedores pelo menos uma vez por ano, mesmo satisfeito com o serviço. Prazos, condições de pagamento e preços mudam no mercado, e fornecedores raramente oferecem uma condição melhor sem serem provocados.`],
  ['d',`Tenha`,`um processo de aprovação, mesmo sendo você a única pessoa envolvida. Antes de qualquer despesa nova e recorrente, pergunte: ela é essencial, é temporária, ou é uma escolha que eu poderia adiar?`],
  ['h',`A rotina de fechamento`],
  ['p',`Registrar entradas e saídas todos os dias, fechar o mês somando os dois lados, e projetar os próximos 30 dias com o que já está confirmado (contratos, parcelas, contas fixas) parece trabalhoso no papel, mas leva poucos minutos quando vira hábito semanal. O ganho não é só organização: é conseguir enxergar um problema de caixa com quatro ou seis semanas de antecedência, tempo suficiente para agir, em vez de descobrir o aperto no dia em que a conta não fecha.`],
  ['h',`Como colocar em prática`],
  ['s',`Registre todas as movimentações, todos os dias. Não é preciso um sistema caro: uma planilha simples com data, categoria, entrada ou saída e valor já resolve no início.`],
  ['s',`Separe entradas e saídas por categoria, pelo menos as grandes: receita de vendas e serviços, custos fixos, custos variáveis, impostos e pró-labore.`],
  ['s',`Classifique também cada despesa como fixa ou variável, e revise pelo menos as recorrentes a cada trimestre.`],
  ['s',`Feche o mês: some as entradas, some as saídas, veja o resultado. Não pule esse passo, mesmo nos meses mais corridos.`],
  ['s',`Projete os próximos 30 dias com o que já está confirmado; isso evita surpresas de caixa.`],
  ['m',`Escolha um dia fixo da semana (por exemplo, toda sexta) só para atualizar seus registros financeiros. Quinze minutos bastam, se forem feitos com constância.`]]},

 {id:3,sec:2,t:`Planejamento e Metas Financeiras`,sub:`Capítulo 3`,b:[
  ['e',`Controlar é indispensável, mas só o planejamento transforma números em direção.`],
  ['h',`Como montar um orçamento do zero`],
  ['p',`Um orçamento é uma previsão organizada de receitas e despesas antes de o mês acontecer, o oposto de registrar o que já aconteceu, que é o fluxo de caixa do capítulo anterior. Montar um orçamento do zero começa por listar, de um lado, as fontes de receita esperadas no mês, e do outro, as categorias de despesa, fixas e variáveis.`],
  ['p',`Para cada categoria, defina um valor esperado seguindo três referências, nesta ordem de confiança: o que já está contratado ou combinado (um contrato assinado, uma parcela já negociada); a média dos últimos meses; e, só na falta das duas anteriores, uma estimativa. Vale orçar mês a mês, e não usar uma média genérica de ano inteiro: sazonalidade, datas comemorativas e o ciclo do seu tipo de negócio mudam a realidade de cada mês específico.`],
  ['h',`Orçado x realizado: o hábito que faz o orçamento valer a pena`],
  ['p',`Orçar sem depois comparar com o que de fato aconteceu é como definir uma rota no mapa e nunca mais olhar para ela durante a viagem. O valor do orçamento não está em acertar o número exato (quase impossível todo mês), mas em entender as diferenças.`],
  ['p',`Ao final de cada mês, compare categoria por categoria o orçado com o realizado, e faça duas perguntas para toda diferença relevante: ela foi pontual (um imprevisto, uma oportunidade) ou é uma tendência que vai se repetir? E o que isso ensina sobre como orçar o próximo mês com mais precisão? Esse ciclo, orçar, acompanhar, ajustar, é o que transforma o orçamento de uma peça de ficção em ferramenta de gestão de verdade, e vale a pena manter mesmo nos meses bons: é mais fácil aprender a interpretar os números sem a pressão de uma crise.`],
  ['h',`Metas SMART aplicadas ao seu negócio`],
  ['p',`Metas vagas, como "quero vender mais" ou "quero ter uma reserva maior", raramente saem do papel, porque não dizem nada sobre o que fazer amanhã de manhã. Uma forma simples de transformar uma meta vaga em uma meta que funciona é passá-la pelo filtro SMART, testando cada uma das cinco letras:`],
  ['d',`Specific (específica)`,`a meta descreve exatamente o quê, sem ambiguidade; não é "vender mais", é "aumentar o faturamento do produto X".`],
  ['d',`Measurable (mensurável)`,`a meta tem um número que permite saber, sem discussão, se foi atingida.`],
  ['d',`Attainable (atingível)`,`a meta é ambiciosa, mas realista diante do histórico e da capacidade atual do negócio.`],
  ['d',`Relevant (relevante)`,`a meta está de fato conectada ao seu porquê e à direção que você quer para o negócio, não é só um número por vaidade.`],
  ['d',`Time-bound (temporal)`,`a meta tem uma data ou um prazo definido; sem prazo, toda meta vira "algum dia".`],
  ['p',`Um exemplo que passa pelas cinco letras: "aumentar o faturamento do serviço de consultoria em 15%, mantendo a margem acima de 30%, nos próximos 3 meses." Compare com "quero faturar mais": a diferença não é só de redação, é de conseguir saber, todo mês, se você está no caminho certo.`],
  ['h',`Como colocar em prática`],
  ['s',`Monte um orçamento mensal por categoria, mês a mês, usando contratos e histórico como principais referências.`],
  ['s',`No fim do mês, compare orçado x realizado: as maiores diferenças costumam ser onde está a informação mais valiosa.`],
  ['s',`Anote, para cada diferença relevante, se ela foi pontual ou se é uma tendência, e ajuste o orçamento do mês seguinte com base nisso.`],
  ['s',`Transforme metas vagas em metas SMART: específicas, mensuráveis, atingíveis, relevantes e com prazo definido.`],
  ['s',`Reserve um momento mensal, nem que seja 30 minutos, só para revisar orçamento e metas; sem essa revisão, o planejamento vira apenas um documento esquecido.`],
  ['m',`Metas financeiras funcionam melhor quando têm prazo, número e responsável definidos, mesmo que o responsável seja só você.`]]},

 {id:4,sec:3,t:`Reservas e Proteção`,sub:`Capítulo 4`,b:[
  ['e',`Um negócio saudável não é aquele que nunca passa por um mês difícil. É aquele que está preparado para quando isso acontecer.`],
  ['h',`Quanto reservar, de verdade`],
  ['p',`A conta clássica de reserva de emergência (somar as despesas fixas essenciais e multiplicar por um número entre 3 e 6) é um bom ponto de partida, mas vale ajustar esse número à realidade do seu negócio. Negócios com receita sazonal, ou com ciclo de recebimento longo (que faturam mas recebem só 30, 60 ou 90 dias depois), tendem a precisar de uma reserva mais próxima do teto dessa faixa, ou até acima dela.`],
  ['p',`O mesmo vale se boa parte da sua receita depende de poucos clientes: quanto mais concentrada a receita, maior o impacto de perder um cliente grande ou de enfrentar inadimplência, e maior deveria ser o colchão de segurança. E vale calcular a reserva pessoal separadamente da reserva do negócio: são dois colchões para dois riscos diferentes.`],
  ['h',`Reserva não é dinheiro parado, mas também não é aplicação arriscada`],
  ['p',`O objetivo da reserva de emergência não é render o máximo possível, é estar disponível exatamente quando você precisar dela, sem perder valor. Isso significa priorizar liquidez (a facilidade de resgatar o dinheiro rapidamente, sem esperar prazos ou pagar multas) acima de rentabilidade. Deixar a reserva parada numa conta sem nenhum rendimento desperdiça poder de compra para a inflação, mas colocá-la em aplicações de maior risco ou baixa liquidez tira dela justamente a função que deveria cumprir.`],
  ['p',`Para decidir onde alocar a reserva (e também o restante dos investimentos do negócio ou pessoais), ajuda entender as características básicas dos principais tipos de investimentos disponíveis: o risco de cada um, a liquidez e como funciona a tributação.`],
  ['h',`Os principais tipos de investimento`],
  ['p',`Cada tipo de investimento equilibra risco, liquidez e rentabilidade de um jeito diferente; não existe opção perfeita para todos os objetivos, e a reserva de emergência tem prioridades diferentes de um investimento de longo prazo:`],
  ['d',`Poupança`,`risco praticamente nulo e liquidez imediata, mas rentabilidade historicamente baixa, muitas vezes abaixo da inflação em determinados períodos. Faz sentido para valores pequenos ou como estacionamento de curtíssimo prazo, raramente como a principal reserva de um negócio.`],
  ['d',`CDB (Certificado de Depósito Bancário)`,`o investidor empresta dinheiro ao banco emissor em troca de uma remuneração; o risco varia com a solidez do banco (bancos menores costumam pagar mais, para compensar o risco maior), e a liquidez depende do produto: alguns permitem resgate diário, outros só no vencimento.`],
  ['d',`Tesouro Direto`,`títulos públicos emitidos pelo governo federal, com risco muito baixo. O Tesouro Selic acompanha a taxa básica de juros, tem liquidez diária e costuma ser uma das opções mais indicadas para reserva de emergência; o Tesouro Prefixado trava uma taxa fixa na compra; e o Tesouro IPCA+ paga inflação mais uma taxa fixa, protegendo o poder de compra no longo prazo.`],
  ['d',`LCI e LCA (Letra de Crédito Imobiliário e do Agronegócio)`,`funcionam de forma parecida com o CDB, com risco atrelado ao banco emissor, mas contam com isenção de Imposto de Renda para pessoa física; em geral têm um prazo de carência, sem resgate antes de uma data mínima.`],
  ['d',`Ações`,`representam uma fatia de participação em uma empresa listada em bolsa; risco alto e volatilidade significativa no curto prazo, sem garantia de retorno. Ações ON dão direito a voto; ações PN costumam ter prioridade no recebimento de dividendos. Parte do retorno vem dos dividendos, hoje isentos de Imposto de Renda para pessoa física; o JCP (Juros sobre Capital Próprio) já é tributado em 15% na fonte.`],
  ['d',`FIIs (Fundos de Investimento Imobiliário)`,`permitem investir em imóveis comprando cotas negociadas em bolsa; o fundo distribui aos cotistas os aluguéis recebidos, mas o valor da cota também sobe e desce com o mercado: risco moderado a alto, dependendo do fundo.`],
  ['d',`Investimentos no exterior`,`uma forma de diversificar para fora do Brasil, direto numa corretora internacional ou por produtos listados aqui, como BDRs ou ETFs internacionais. Reduzem a dependência da economia e da moeda brasileiras, mas trazem exposição à variação cambial e regras de tributação específicas.`],
  ['h',`Imposto de renda: isenções e a tabela regressiva`],
  ['p',`Nem todo investimento paga a mesma alíquota de Imposto de Renda, e essa diferença muda o retorno líquido de forma relevante, especialmente ao comparar produtos de renda fixa. Poupança, LCI, LCA e debêntures incentivadas são isentas de IR para pessoa física. Já o CDB, o Tesouro Direto (fora os títulos isentos) e as debêntures comuns seguem a tabela regressiva do IR, em que a alíquota cai quanto mais tempo o dinheiro fica aplicado:`],
  ['d',`Até 180 dias`,`alíquota de 22,5% sobre o rendimento, a mais alta da tabela.`],
  ['d',`De 181 a 360 dias`,`alíquota de 20%.`],
  ['d',`De 361 a 720 dias`,`alíquota de 17,5%.`],
  ['d',`Acima de 720 dias`,`alíquota de 15%, a mais baixa, para quem deixa o dinheiro aplicado por mais de dois anos.`],
  ['p',`Ações e FIIs seguem regras próprias: o ganho de capital na venda de ações comuns é tributado em 15% (20% em day trade), com isenção de IR para quem vende até R$ 20.000 em ações no mês, fora day trade. Os FIIs têm os rendimentos mensais distribuídos isentos de IR para pessoa física, mas o ganho de capital na venda das cotas é tributado em 20%, sem essa faixa de isenção mensal. Os dividendos recebidos de ações são isentos de Imposto de Renda para pessoa física na distribuição, pela regra vigente, o que não vale para o JCP, tributado em 15% na fonte.`],
  ['h',`IOF: a armadilha de resgatar cedo demais`],
  ['p',`Além do Imposto de Renda, alguns investimentos de renda fixa (como CDB e Tesouro Direto) estão sujeitos ao IOF quando resgatados antes de 30 dias da aplicação. O IOF segue uma tabela regressiva própria: a alíquota começa em 96% do rendimento no primeiro dia e cai a cada dia em que o dinheiro permanece aplicado, até chegar a zero exatamente no 30º dia.`],
  ['d',`1º dia`,`96% de IOF sobre o rendimento, a alíquota mais alta, para quem resgata no dia seguinte à aplicação.`],
  ['d',`10º dia`,`66% sobre o rendimento.`],
  ['d',`20º dia`,`36% sobre o rendimento.`],
  ['d',`29º dia`,`3% sobre o rendimento, o último dia em que o IOF ainda incide.`],
  ['d',`A partir do 30º dia`,`0% de IOF; passa a incidir apenas a tabela regressiva do Imposto de Renda.`],
  ['p',`Na prática, o IOF só afeta quem resgata um investimento de renda fixa em menos de um mês; por isso, mesmo dentro da reserva de emergência, vale evitar movimentações desnecessárias nos primeiros 30 dias após cada aplicação, sempre que a urgência permitir esperar.`],
  ['h',`Previdência privada: uma reserva pensando na aposentadoria`],
  ['p',`Diferente da reserva de emergência, pensada para imprevistos de curto prazo, a previdência privada é um investimento de longuíssimo prazo, criado para construir um patrimônio para a aposentadoria, complementando (ou substituindo, para quem não contribui ao INSS) a renda na fase em que o negócio ou o trabalho ativo já não sustentam sozinhos o padrão de vida desejado.`],
  ['d',`PGBL (Plano Gerador de Benefício Livre)`,`permite abater as contribuições, até 12% da renda bruta anual, da base de cálculo do Imposto de Renda, mas só compensa para quem declara pelo modelo completo; no resgate, o imposto incide sobre o valor total (contribuições mais rendimento).`],
  ['d',`VGBL (Vida Gerador de Benefício Livre)`,`não permite esse abatimento na declaração, mas o IR no resgate incide só sobre o rendimento; costuma ser mais indicado para quem declara pelo modelo simplificado, é isento de IR, ou já usa todo o limite de abatimento em outro plano.`],
  ['p',`Em ambos, é possível escolher entre a tabela regressiva de IR (a alíquota cai de 35% para 10% conforme o tempo de permanência aumenta, chegando ao mínimo depois de 10 anos) ou a tabela progressiva, semelhante à tributação do salário. A escolha depende do seu perfil de declaração de IR e do horizonte até a aposentadoria; vale simular as opções, ou conversar com um profissional, antes de decidir.`],
  ['h',`FGC: o que é garantido e como funciona a proteção`],
  ['p',`O FGC (Fundo Garantidor de Créditos) é uma entidade privada, mantida pelos próprios bancos e financeiras, criada para proteger quem tem dinheiro aplicado caso a instituição financeira emissora quebre, sofra intervenção ou liquidação pelo Banco Central.`],
  ['d',`O que é coberto`,`poupança, CDB, RDB, LCI e LCA, entre outros produtos de renda fixa emitidos por bancos e financeiras.`],
  ['d',`Limite por instituição`,`até R$ 250.000 por CPF (ou CNPJ), por instituição financeira ou conglomerado.`],
  ['d',`Teto acumulado`,`no máximo R$ 1.000.000 de garantia por CPF, a cada período de 4 anos, somando todas as instituições.`],
  ['d',`Na prática`,`se o banco ou financeira sofre intervenção ou liquidação, o FGC paga ao investidor o valor garantido, dentro desses limites.`],
  ['p',`O Tesouro Direto não tem garantia do FGC, mas é considerado o investimento mais seguro do país, porque quem garante o pagamento é o Tesouro Nacional, com capacidade de arrecadar impostos e emitir moeda para honrar a dívida pública.`],
  ['p',`Ações e FIIs não contam com nenhuma garantia, nem do FGC nem do governo; o risco ali é de mercado: o valor da ação ou da cota pode cair, e não existe uma entidade que reponha essa perda. Por isso, o valor que compõe a reserva de emergência, por definição, não deveria estar em ações ou fundos imobiliários. A previdência privada também não conta com garantia do FGC, mas os recursos ficam segregados em fundos próprios, geridos separadamente do patrimônio da seguradora ou do banco que administra o plano.`],
  ['p',`Este guia tem caráter educativo, e as alíquotas de IR e IOF e os limites do FGC podem mudar com o tempo; para decidir onde exatamente alocar a sua reserva e os demais investimentos, vale conversar com um profissional que conheça o seu contexto completo e as regras vigentes.`],
  ['h',`Proteção tributária: reserve antes de precisar`],
  ['p',`Impostos e obrigações (como o DAS do Simples Nacional) costumam ser a surpresa mais evitável do fluxo de caixa: o valor já é conhecido com antecedência, mas muitos negócios só calculam na hora de pagar. Reservar o percentual estimado assim que a receita entra, em vez de deixar para calcular no vencimento, transforma um imposto em algo já previsto, e não em um susto mensal.`],
  ['h',`O impacto no orçamento da casa`],
  ['p',`Se o negócio sustenta, ainda que parcialmente, o orçamento da sua casa, vale conversar abertamente com quem divide esse orçamento com você sobre o que aconteceria se o faturamento caísse por dois ou três meses seguidos, não para gerar ansiedade, mas para que a decisão sobre onde cortar, se for necessário, já esteja pensada com calma, e não tomada às pressas no meio de um aperto.`],
  ['h',`Como colocar em prática`],
  ['s',`Calcule sua reserva de emergência ideal considerando sazonalidade, prazo de recebimento e concentração de clientes, não só a fórmula padrão de 3 a 6 meses.`],
  ['s',`Separe, todo mês, um pequeno percentual do que entra para essa reserva, antes de gastar com qualquer outra coisa.`],
  ['s',`Priorize liquidez na reserva de emergência: ela precisa estar disponível quando for necessária, não render o máximo possível.`],
  ['s',`Ao escolher onde alocar a reserva, compare a garantia (FGC ou Tesouro Nacional) e a tributação de cada opção: Tesouro Selic e CDBs com liquidez diária costumam ser os mais indicados para esse objetivo específico.`],
  ['s',`Organize-se para impostos e obrigações com antecedência: reserve o valor estimado assim que a receita entra.`],
  ['s',`Se aplicar em renda fixa fora da reserva de emergência, evite resgatar antes de 30 dias corridos (por causa do IOF) e, se pensar em previdência privada, avalie com calma entre PGBL e VGBL antes de contratar.`],
  ['s',`Tenha um "plano B" simples e escrito, idealmente conversado com quem divide o orçamento da casa: o que você faria se o faturamento caísse pela metade por dois meses seguidos?`],
  ['m',`Não existe reserva perfeita desde o primeiro mês. O importante é começar com uma porcentagem, mesmo pequena, e manter a constância.`]]},

 {id:5,sec:4,t:`Visão de Resultado do Negócio`,sub:`Capítulo 5`,b:[
  ['e',`Faturar é diferente de lucrar, e é entendendo essa diferença que se toma boas decisões sobre preço, investimento e crescimento.`],
  ['h',`Faturar não é lucrar: o exemplo que prova isso`],
  ['p',`Imagine dois negócios que faturam exatamente R$ 30.000 no mês. O primeiro tem custos e despesas de R$ 26.000, incluindo pró-labore e impostos: sobra R$ 4.000, uma margem de 13%. O segundo, com o mesmo faturamento, tem custos e despesas de R$ 31.000, fecha o mês com prejuízo de R$ 1.000, margem negativa. Olhando só o faturamento, os dois pareciam igualmente bem-sucedidos; olhando a margem, a diferença é a distância entre um negócio saudável e um negócio que está, aos poucos, se descapitalizando.`],
  ['h',`Como calcular sua margem real`],
  ['p',`A margem de lucro é: (Receita − todos os custos, incluindo pró-labore e impostos) ÷ Receita. O ponto que mais gera distorção nessa conta é esquecer de incluir o pró-labore e os impostos como custos: sem eles, a margem parece muito melhor do que é de fato. Se o negócio fatura R$ 20.000, tem R$ 12.000 em custos e despesas, R$ 4.000 de pró-labore e R$ 1.500 de impostos, a margem real é (20.000 − 12.000 − 4.000 − 1.500) ÷ 20.000, ou seja, 12,5%, bem diferente dos "40% de sobra" que apareceriam se pró-labore e impostos fossem esquecidos da conta.`],
  ['h',`Precificar a partir do custo, não do achismo`],
  ['p',`Precificar olhando só para a concorrência ou para o que "parece justo" é um dos caminhos mais comuns para uma margem apertada demais. O ponto de partida mais seguro é o custo: quanto custa, de fato, entregar aquele produto ou serviço, incluindo uma fatia proporcional dos custos fixos do negócio, e só depois disso, decidir a margem desejada em cima.`],
  ['p',`Vale também olhar, produto a produto ou serviço a serviço, qual é a contribuição real de cada um para o resultado: alguns itens do seu portfólio podem ter um volume de vendas alto e, ainda assim, contribuir pouco (ou nada) para o lucro, depois de descontados os custos que eles geram.`],
  ['h',`Preço também é sobre valor percebido, não só custo`],
  ['p',`O custo define o piso do preço: abaixo dele, você trabalha no prejuízo. Mas o teto do preço não é definido pelo custo, e sim pelo valor que o cliente enxerga em resolver o problema dele. Dois negócios podem ter um custo de entrega parecido e, ainda assim, cobrar preços bem diferentes, porque um deles comunica com mais clareza o resultado que entrega, o problema que evita ou a experiência que proporciona.`],
  ['p',`Isso não significa cobrar o que "der na cabeça": significa que, depois de garantir a margem mínima pelo custo, vale investir tempo em entender o que o seu cliente ideal mais valoriza (rapidez, exclusividade, tranquilidade, resultado garantido) e comunicar o preço em torno disso, em vez de justificá-lo só pela lista de custos. Preço baixo demais também é um problema: sinaliza baixo valor e atrai o cliente errado, aquele que só está ali pelo preço e vai embora assim que encontrar algo mais barato.`],
  ['h',`Fechando o ciclo: o resultado sustenta o seu porquê`],
  ['p',`O motivo de existir do seu negócio, o seu porquê, do capítulo 1, só se sustenta no tempo se o resultado financeiro permitir. Não é contraditório cuidar de propósito e de margem ao mesmo tempo: é o lucro que garante que o propósito continue existindo daqui a um, cinco, dez anos. Entender esse ciclo, do porquê ao resultado, é o que transforma o Raio-X Financeiro do Empreendedor de um diagnóstico pontual em uma prática de gestão contínua.`],
  ['h',`Como colocar em prática`],
  ['s',`Calcule sua margem de lucro real: (Receita − todos os custos, incluindo pró-labore e impostos) ÷ Receita.`],
  ['s',`Revise sua precificação com base em custos e margem desejada, não apenas no que a concorrência cobra ou no que "parece justo".`],
  ['s',`Identifique, produto a produto ou serviço a serviço, quais realmente deixam lucro no fim do mês e quais só geram trabalho.`],
  ['s',`Use essa visão para decidir onde investir seu tempo e energia: nem sempre o que mais fatura é o que mais compensa.`],
  ['m',`Se você nunca calculou sua margem real, esse é o exercício mais valioso deste guia. Vale a pena parar tudo e fazer essa conta hoje.`]]},

 {id:6,t:`DRE Simplificada: a Demonstração de Resultado do seu Negócio`,sub:`Capítulo 6`,b:[
  ['e',`O fluxo de caixa mostra o que entrou e saiu da conta; a DRE mostra se o negócio, de fato, dá lucro, reunindo receitas e despesas no período a que pertencem, e não apenas quando o dinheiro mudou de mãos.`],
  ['h',`O que é a DRE e por que ela conta uma história diferente do caixa`],
  ['p',`A DRE (Demonstração de Resultado do Exercício) é o relatório que resume, em um único lugar, a receita, os custos, as despesas e o lucro (ou prejuízo) de um período, normalmente um mês, um trimestre ou um ano. Diferente do fluxo de caixa, do capítulo 2, que registra o dinheiro que efetivamente entrou e saiu, a DRE trabalha em regime de competência: uma venda entra na DRE do mês em que aconteceu, mesmo que o cliente só pague depois; uma despesa entra no mês a que se refere, mesmo que tenha sido paga antes ou depois.`],
  ['p',`Entender essa diferença separa quem só sabe "quanto tem na conta" de quem sabe, de fato, "se o negócio dá lucro": perguntas diferentes, que merecem ferramentas diferentes.`],
  ['h',`Como montar uma DRE simplificada, passo a passo`],
  ['p',`Uma DRE simplificada, para um pequeno negócio, não precisa seguir todo o rigor técnico de uma demonstração contábil oficial, mas manter a mesma lógica de estrutura ajuda a enxergar onde o lucro se perde. A estrutura básica, de cima para baixo:`],
  ['d',`Receita Bruta`,`tudo o que o negócio faturou no período, antes de qualquer desconto ou imposto sobre a venda.`],
  ['d',`(−) Deduções e impostos sobre a venda`,`devoluções, descontos concedidos e impostos cobrados diretamente sobre a venda (como o DAS, no Simples Nacional).`],
  ['d',`= Receita Líquida`,`o que realmente fica depois dos itens acima.`],
  ['d',`(−) Custos diretos (CMV/CPV ou custo do serviço)`,`o que custa, de forma direta, produzir o produto ou entregar o serviço vendido: matéria-prima, mão de obra direta, comissões de venda.`],
  ['d',`= Lucro Bruto`,`o que sobra depois de pagar diretamente pelo que foi vendido.`],
  ['d',`(−) Despesas operacionais`,`aluguel, salários administrativos, marketing, contabilidade e demais custos fixos para o negócio funcionar, independente do volume vendido.`],
  ['d',`= Lucro Operacional`,`o resultado que vem da operação do negócio em si.`],
  ['d',`(−) Pró-labore e despesas financeiras`,`remuneração do(a) dono(a) e o custo de eventuais dívidas ou financiamentos (juros, tarifas).`],
  ['d',`= Lucro Líquido`,`o resultado final do período, depois de tudo.`],
  ['p',`Para a maioria dos negócios de serviço, várias dessas linhas ficam simples ou até somem: um prestador de serviço individual, por exemplo, frequentemente não tem um CMV separado do resto. O importante não é seguir o modelo à risca, e sim manter a lógica de descontar, em ordem, o que é direto do que é operacional, do que é financeiro.`],
  ['h',`As três margens que a DRE revela`],
  ['p',`A DRE não serve só para chegar a um número final; cada margem intermediária conta uma parte diferente da história do negócio:`],
  ['d',`Margem Bruta`,`Lucro Bruto ÷ Receita Líquida. Mostra quanto sobra depois do custo direto de vender; margem bruta baixa aponta para um problema de precificação ou de custo do produto ou serviço em si.`],
  ['d',`Margem Operacional`,`Lucro Operacional ÷ Receita Líquida. Mostra se a estrutura fixa do negócio (aluguel, equipe, ferramentas) está no tamanho certo para o volume de receita atual.`],
  ['d',`Margem Líquida`,`Lucro Líquido ÷ Receita Líquida. O resultado final, depois de tudo, incluindo pró-labore e despesas financeiras; é essa a margem real, a mesma calculada no capítulo 5.`],
  ['p',`Comparar as três margens ao longo dos meses, em vez de olhar só o lucro líquido isolado, ajuda a identificar exatamente onde o resultado está sendo pressionado: se no custo direto, na estrutura fixa ou nas despesas financeiras.`],
  ['h',`Entender os números não é virar contador`],
  ['p',`Montar e entender uma DRE simplificada não exige formação em contabilidade, exige apenas a disposição de olhar os números com curiosidade, entendendo que eles contam a história real do negócio, muitas vezes diferente da sensação do dia a dia. Um negócio pode "parecer" estar indo bem (agenda cheia, caixa positivo no fim do mês) e, ainda assim, ter uma margem líquida baixa demais para se sustentar no longo prazo, e só a DRE, revisada com regularidade, revela isso com clareza.`],
  ['h',`Como colocar em prática`],
  ['s',`Monte sua DRE simplificada mês a mês, seguindo a estrutura: Receita Bruta → Deduções → Receita Líquida → Custos diretos → Lucro Bruto → Despesas Operacionais → Lucro Operacional → Pró-labore e financeiro → Lucro Líquido.`],
  ['s',`Calcule as três margens (bruta, operacional e líquida) todo mês, e acompanhe a evolução delas, não só o valor absoluto do lucro.`],
  ['s',`Sempre que uma margem cair, identifique em qual etapa da DRE isso aconteceu (custo direto, estrutura fixa ou despesas financeiras) antes de tentar resolver o problema.`],
  ['s',`Não confunda a DRE com o fluxo de caixa: use as duas ferramentas juntas, uma para saber se o negócio paga as contas, outra para saber se ele dá lucro de verdade.`],
  ['m',`Se você nunca fez uma DRE do seu negócio, comece pelo mês passado, com os números que já tem em mãos; não precisa esperar o próximo mês fechar para começar a enxergar essa história.`]]},

 {id:7,t:`Ponto de Equilíbrio: Quanto Você Precisa Faturar`,sub:`Capítulo 7`,b:[
  ['e',`Ponto de equilíbrio é o faturamento mínimo para o negócio não dar prejuízo; saber esse número muda a forma como você olha para cada meta, cada preço e cada decisão de investimento.`],
  ['h',`O que é o ponto de equilíbrio, e por que ele muda tudo`],
  ['p',`O ponto de equilíbrio (ou break-even) é o valor de faturamento (ou a quantidade de produtos ou serviços vendidos) a partir do qual o negócio cobre todos os seus custos e despesas, fixos e variáveis, sem ainda gerar lucro. Abaixo dele, o negócio opera no prejuízo; acima dele, cada real adicional de receita passa a contribuir para o lucro.`],
  ['p',`Conhecer esse número muda decisões concretas: quantos clientes ou vendas por mês são realmente necessários para o negócio "zerar"; se uma meta de faturamento é realista ou está perigosamente próxima do ponto de equilíbrio; e se vale a pena assumir um novo custo fixo (contratar alguém, alugar um espaço maior), sabendo exatamente o quanto isso eleva o mínimo necessário.`],
  ['h',`Margem de contribuição: a peça que faltava`],
  ['p',`Para calcular o ponto de equilíbrio, primeiro é preciso entender a margem de contribuição: o quanto sobra de cada venda depois de descontar apenas os custos variáveis diretamente ligados a ela (matéria-prima, comissão, taxa de cartão), sem ainda considerar os custos fixos do negócio. Margem de Contribuição = Preço de Venda − Custos Variáveis por unidade (ou, em percentual, Margem de Contribuição ÷ Receita).`],
  ['p',`Essa margem não substitui as três margens do capítulo anterior, ela responde a uma pergunta diferente. A margem bruta, a operacional e a líquida são calculadas sobre o total faturado no período e descontam os custos conforme a sua função na operação, servindo para diagnosticar onde o resultado do mês está sendo pressionado. Já a margem de contribuição é calculada por venda ou por unidade, e separa os custos só pelo comportamento diante do volume: o que é variável entra na conta, o que é fixo (aluguel, salários administrativos, pró-labore) fica de fora. É justamente esse recorte, sem os custos fixos, que permite calcular quantas vendas são necessárias para cobri-los, a base do ponto de equilíbrio.`],
  ['d',`Ponto de equilíbrio em R$`,`Custos Fixos ÷ Margem de Contribuição (%), o faturamento mínimo mensal para cobrir todos os custos.`],
  ['d',`Ponto de equilíbrio em unidades`,`Custos Fixos ÷ Margem de Contribuição por unidade, quantas vendas, no mínimo, são necessárias no mês.`],
  ['p',`Um exemplo simples: se os custos fixos mensais somam R$ 8.000 e a margem de contribuição é de 40% sobre cada venda, o ponto de equilíbrio é R$ 8.000 ÷ 0,40 = R$ 20.000 de faturamento mensal. Faturar menos que isso significa operar no prejuízo, mesmo vendendo bem.`],
  ['h',`Qual é o verdadeiro gargalo do seu negócio`],
  ['p',`Uma ideia central de livros clássicos de gestão empresarial é que todo negócio tem um gargalo: um único ponto que limita o quanto ele consegue vender ou entregar, e que determina o resultado final do sistema inteiro, não importa o quanto as outras partes melhorem. Pode ser a sua própria agenda (você é quem atende), a capacidade de produção, um fornecedor lento, ou até o caixa disponível para comprar mais insumo.`],
  ['p',`Antes de tentar melhorar tudo ao mesmo tempo, vale identificar qual é, hoje, o gargalo real do seu negócio: o que, se resolvido, aumentaria o faturamento sem aumentar os custos fixos na mesma proporção. Investir energia em qualquer outro ponto que não seja o gargalo tende a gerar pouco resultado prático, por mais que pareça produtivo.`],
  ['h',`Usando o ponto de equilíbrio para decidir, não só para medir`],
  ['p',`O ponto de equilíbrio ganha força quando vira parte da rotina de decisão, não só um número calculado uma vez e esquecido. Antes de assumir um novo custo fixo, recalcule o ponto de equilíbrio com esse custo incluído, e pergunte se o aumento de faturamento esperado realmente compensa o novo patamar mínimo. Antes de definir uma meta de vendas, compare-a com o ponto de equilíbrio: uma meta que mal ultrapassa esse número é, na prática, uma meta de sobrevivência, não de crescimento.`],
  ['h',`Como colocar em prática`],
  ['s',`Calcule sua margem de contribuição: Preço de Venda − Custos Variáveis por unidade (ou em percentual sobre a receita).`],
  ['s',`Calcule seu ponto de equilíbrio em reais: Custos Fixos ÷ Margem de Contribuição (%).`],
  ['s',`Se vender produtos ou serviços com preço unitário definido, calcule também o ponto de equilíbrio em unidades: Custos Fixos ÷ Margem de Contribuição por unidade.`],
  ['s',`Identifique o gargalo atual do seu negócio (o que realmente limita seu faturamento) antes de investir esforço em melhorias que não afetam esse ponto.`],
  ['s',`Sempre que avaliar um novo custo fixo ou uma nova meta de vendas, recalcule o ponto de equilíbrio antes de decidir.`],
  ['m',`Se você nunca calculou seu ponto de equilíbrio, você provavelmente está definindo metas de vendas "no escuro". Esse é um dos números mais reveladores para decidir com segurança.`]]},

 {id:8,t:`Painel de Indicadores: Gerindo com Números, não com Sensação`,sub:`Capítulo 8`,b:[
  ['e',`Um negócio que depende só da memória e da sensação do dono para saber como vai indo tem um limite claro de crescimento. Um painel de indicadores simples é o que permite gerir com clareza e, com o tempo, delegar sem perder o controle.`],
  ['h',`Por que um negócio não deveria depender só da sua cabeça`],
  ['p',`Uma ideia importante sobre empreender bem é a diferença entre trabalhar NO negócio (fazer, entregar, atender) e trabalhar SOBRE o negócio (organizar, medir, decidir com base em dados). Muitos donos de pequenos negócios vivem inteiramente na primeira função, carregando todos os números na cabeça, o que funciona até certo ponto, mas trava o crescimento e torna o negócio absolutamente dependente da presença constante do dono.`],
  ['p',`Um painel de indicadores simples resolve essa dependência: transforma o que estava só na sua cabeça em números visíveis, acompanháveis e, com o tempo, delegáveis: um passo importante para quem quer que o negócio funcione também quando o dono não está o tempo todo presente.`],
  ['h',`Os indicadores essenciais para começar`],
  ['p',`Não é preciso um painel sofisticado, com dezenas de métricas, para começar a gerir com números. Um pequeno negócio já ganha a maior parte do benefício acompanhando um punhado de indicadores essenciais, todo mês:`],
  ['d',`Faturamento x Meta`,`quanto entrou no mês comparado ao que foi planejado no orçamento (capítulo 3).`],
  ['d',`Margem líquida`,`o percentual real que sobra depois de todos os custos, calculado pela DRE simplificada (capítulo 6).`],
  ['d',`Ponto de equilíbrio atingido ou não`,`se o faturamento do mês superou o mínimo necessário para não operar no prejuízo (capítulo 7).`],
  ['d',`Ticket médio`,`o valor médio de cada venda ou contrato; quedas no ticket médio, mesmo com volume de vendas estável, indicam problema de precificação ou de mix de produtos ou serviços.`],
  ['d',`Inadimplência`,`o quanto do que foi faturado ainda não foi efetivamente recebido, e há quanto tempo.`],
  ['d',`Saldo em caixa e reserva de emergência`,`quantos meses de operação o negócio sustentaria hoje, sem nenhuma nova entrada (capítulo 4).`],
  ['h',`Como montar sua rotina de acompanhamento`],
  ['p',`Um painel de indicadores só cumpre sua função se for revisado com regularidade: o valor está muito mais na rotina de olhar do que na sofisticação da ferramenta. Uma planilha simples, atualizada uma vez por mês, no mesmo dia fixo em que você já fecha o fluxo de caixa (capítulo 2) e compara orçado com realizado (capítulo 3), é suficiente para a maioria dos pequenos negócios.`],
  ['p',`O objetivo não é acumular meses de histórico antes de agir, é olhar os números todo mês, comparar com o mês anterior e com a meta, e fazer pelo menos um ajuste concreto a partir do que foi visto, por menor que seja.`],
  ['h',`Fechando o método: do diagnóstico ao painel`],
  ['p',`Os oito capítulos anteriores formam um ciclo completo, não uma lista de tarefas isoladas: você separa as contas (capítulo 1) para conseguir enxergar a realidade; controla o fluxo de caixa (capítulo 2) para não ser pego de surpresa; planeja com orçamento e metas (capítulo 3) para ter direção; protege o negócio com reserva (capítulo 4); entende sua margem e seu preço (capítulo 5); monta a DRE para ver o resultado de verdade (capítulo 6); calcula o ponto de equilíbrio para saber o mínimo necessário (capítulo 7); e, por fim, reúne tudo isso num painel de indicadores (capítulo 8) que transforma gestão financeira em rotina, não em esforço pontual.`],
  ['p',`Esse é o método completo de gestão financeira para pequenos negócios: não é sobre aplicar tudo de uma vez, é sobre construir, passo a passo, a capacidade de decidir com números, não com sensação. Falta uma última peça, tão importante quanto qualquer fórmula deste guia: como fazer essa rotina durar além da motivação inicial. É o assunto do capítulo 9.`],
  ['h',`Como colocar em prática`],
  ['s',`Escolha de 5 a 6 indicadores essenciais para começar, não tente acompanhar tudo de uma vez.`],
  ['s',`Monte uma planilha simples com esses indicadores, um espaço por mês, para começar a construir histórico.`],
  ['s',`Atualize o painel no mesmo dia fixo em que já revisa fluxo de caixa e orçado x realizado.`],
  ['s',`A cada revisão mensal, compare com o mês anterior e com a meta, e defina pelo menos um ajuste concreto a partir do que os números mostraram.`],
  ['s',`Depois de alguns meses de rotina consistente, considere delegar a atualização do painel a alguém da equipe (ou a um serviço de BPO financeiro), mantendo para você a análise e a decisão.`],
  ['m',`O painel de indicadores é o que transforma tudo o que você aprendeu neste guia em rotina de gestão. Comece simples, com poucos números, e evolua com o tempo.`]]},

 {id:9,t:`O Hábito da Gestão Financeira`,sub:`Capítulo 9`,b:[
  ['e',`Todo o método deste guia depende de uma coisa que nenhuma planilha resolve sozinha: repetir a rotina depois que a motivação inicial passa. É aí que entra a ciência do hábito, tanto para o negócio quanto para a sua vida pessoal.`],
  ['h',`O hábito vence a motivação`],
  ['p',`A forma mais comum de tentar organizar as finanças é um impulso de motivação: uma virada de ano, uma crise de caixa, uma dívida que assustou. Nesses momentos, é fácil montar uma planilha nova, prometer disciplina e manter tudo em dia, por algumas semanas. O problema da motivação é que ela é, por natureza, instável: some no dia cansado, no mês corrido, na crise que se resolveu.`],
  ['p',`A alternativa mais duradoura, bastante discutida em livros sobre ciência comportamental, é parar de depender de motivação e passar a depender de hábito: uma rotina automática, que acontece quase sem esforço consciente, porque virou parte do funcionamento normal do seu dia ou da sua semana. Tudo o que este guia ensinou até aqui (fluxo de caixa, orçamento, painel de indicadores) só sustenta resultado no longo prazo se virar hábito, não tarefa.`],
  ['h',`O ciclo do hábito: deixa, rotina e recompensa`],
  ['p',`Um hábito se forma a partir de um ciclo de três partes que se repete até virar automático. A deixa é o gatilho que avisa ao cérebro qual comportamento seguir: pode ser um horário, um dia da semana, um lugar ou até outra ação que você já faz. A rotina é o comportamento em si: no caso deste guia, abrir a planilha, atualizar o painel, comparar orçado com realizado. E a recompensa é o que faz o cérebro querer repetir o ciclo; sem ela, o hábito não se firma, porque não há motivo para o cérebro priorizar aquele comportamento de novo.`],
  ['d',`Deixa`,`um dia e horário fixos (ex.: toda sexta às 17h, ou logo depois de fechar o caixa da semana), o gatilho que dispara a rotina, sem precisar de decisão consciente toda vez.`],
  ['d',`Rotina`,`a sequência exata de ações (abrir a planilha, atualizar os números, comparar com a meta) decidida com antecedência, para não depender de força de vontade no momento.`],
  ['d',`Recompensa`,`algo que torne o momento satisfatório, desde a sensação concreta de clareza e controle, até um pequeno prazer associado (um café, uma pausa) logo depois da rotina.`],
  ['p',`Muita gente monta a rotina e ignora a recompensa, e é exatamente por isso que ela não dura. Vale escolher a recompensa com a mesma intenção com que se escolhe a deixa e a rotina.`],
  ['h',`Hábitos-chave: o pequeno hábito que puxa o resto`],
  ['p',`Alguns hábitos têm um efeito desproporcional: mantê-los em dia tende a arrastar junto uma série de outras mudanças positivas, mesmo sem esforço direto nelas, são os chamados hábitos-chave. No contexto deste guia, a revisão semanal do fluxo de caixa (capítulo 2) ou a atualização mensal do painel de indicadores (capítulo 8) costumam funcionar como hábito-chave: quem mantém essa rotina firme tende, quase automaticamente, a manter também o orçamento em dia, a reserva alimentada e a precificação revisada, porque a rotina obriga a olhar para esses números com regularidade.`],
  ['p',`A mesma lógica vale para a vida pessoal, e não só para o negócio. Uma revisão semanal ou mensal do orçamento doméstico, ou a conversa fixa sobre dinheiro a dois (capítulo 1), também funcionam como hábitos-chave pessoais: sustentar essa única rotina tende a manter alinhados outros aspectos das finanças da casa, com muito menos esforço do que tentar controlar cada gasto isoladamente. Vale identificar qual é o seu hábito-chave, um no negócio, outro na vida pessoal, e proteger essas duas rotinas antes de qualquer outra.`],
  ['h',`Da vontade ao sistema: ferramentas para não depender da motivação`],
  ['p',`Algumas táticas simples ajudam a transformar a intenção em hábito de verdade, sem depender de disciplina renovada todo dia:`],
  ['d',`Empilhamento de hábitos`,`encaixe a nova rotina financeira logo depois de um hábito que você já tem automatizado ("depois do café da segunda-feira, eu abro o painel"), em vez de tentar criar um horário do zero.`],
  ['d',`Reduza o atrito`,`deixe a planilha, o aplicativo ou o caderno sempre à mão e prontos para uso; cada clique ou busca a mais entre você e a rotina é uma chance de adiar.`],
  ['d',`Torne a deixa visível`,`um lembrete fixo na agenda, um alarme recorrente ou uma nota física funcionam melhor do que confiar só na memória.`],
  ['d',`Acompanhe a sequência`,`marcar num calendário ou aplicativo cada vez que a rotina foi cumprida cria uma prova visual de constância, que é, em si, uma recompensa poderosa.`],
  ['d',`Se a rotina quebrar`,`em algum momento de crise ou correria, não abandone o hábito inteiro; mantenha a mesma deixa e a mesma recompensa, e ajuste só a rotina, até ela caber de novo na sua realidade.`],
  ['h',`Como colocar em prática`],
  ['s',`Escolha uma deixa fixa para sua rotina financeira: um dia e horário específicos, sempre os mesmos.`],
  ['s',`Defina a rotina exata que essa deixa vai disparar, passo a passo, para não precisar decidir cada vez.`],
  ['s',`Escolha uma recompensa real para a rotina: algo que faça você querer repeti-la na próxima semana ou no próximo mês.`],
  ['s',`Identifique um hábito-chave na empresa e outro na vida pessoal, e proteja essas duas rotinas antes de qualquer outra.`],
  ['s',`Use o empilhamento de hábitos: encaixe a nova rotina logo depois de algo que você já faz automaticamente.`],
  ['s',`Se a rotina quebrar, não desista do hábito inteiro; mantenha a deixa e a recompensa, e só reajuste a rotina.`],
  ['m',`Hábitos se constroem com repetição, não com força de vontade. Escolha uma deixa, uma rotina e uma recompensa esta semana, e repita (mesmo que pequena) até virar automático.`]]},

 {id:10,t:`Do Diagnóstico à Ação`,sub:`Conclusão`,b:[
  ['p',`Organizar as finanças de um negócio não é um projeto de um mês só. É uma prática que se constrói passo a passo, com pequenas mudanças sustentadas ao longo do tempo. Os 9 capítulos deste guia dão o caminho; a constância em aplicá-los é o que realmente muda o resultado.`],
  ['p',`Depois de colocar esses passos em prática por algumas semanas, vale voltar ao Raio-X Financeiro do Empreendedor e refazer o checklist. É uma boa forma de medir sua evolução com números, e não só com a sensação.`],
  ['p',`Este guia tem caráter educativo e não substitui uma análise personalizada do seu negócio. Cada realidade financeira é única, com particularidades que um material genérico não alcança.`],
  ['h',`Pronta ou pronto para o próximo passo?`],
  ['p',`Se quiser ajuda para aplicar esses 9 passos com acompanhamento e um plano feito sob medida para o seu negócio, agende uma conversa de diagnóstico com a Fortera Consultoria. Instagram: @forteraconsultoria.`]]}
];
const GLOSS=[
 ['Formalização e Estrutura do Negócio',[
  ['MEI (Microempreendedor Individual)',`Categoria de formalização para quem fatura até o limite anual definido por lei, com pagamento simplificado de impostos e menos obrigações burocráticas que outras categorias jurídicas.`],
  ['CNPJ (Cadastro Nacional da Pessoa Jurídica)',`Número que identifica uma empresa perante o governo, permitindo emitir nota fiscal, abrir conta bancária empresarial e contratar formalmente.`],
  ['Simples Nacional',`Regime tributário simplificado que unifica vários impostos em uma única guia mensal, pensado para micro e pequenas empresas.`],
  ['DAS (Documento de Arrecadação do Simples Nacional)',`Guia mensal única de pagamento de impostos para quem está enquadrado no MEI ou no Simples Nacional.`],
  ['Pró-labore',`Remuneração fixa que o dono do negócio retira pelo próprio trabalho, mantida separada do lucro da empresa.`]]],
 ['Gestão Financeira Básica',[
  ['Capital de Giro',`Valor necessário para manter o negócio funcionando no dia a dia (comprar estoque, pagar contas) enquanto se espera o dinheiro das vendas entrar.`],
  ['Fluxo de Caixa',`Registro de todas as entradas e saídas de dinheiro do negócio ao longo do tempo; mostra se sobra ou falta dinheiro em caixa.`],
  ['Ponto de Equilíbrio',`O quanto o negócio precisa vender para cobrir todos os custos, sem lucro nem prejuízo.`,`Custos Fixos ÷ (Preço de Venda − Custo Variável por unidade)`],
  ['Margem de Contribuição',`Quanto sobra de cada venda depois de descontar os custos variáveis ligados diretamente a ela, antes de cobrir os custos fixos.`,`Preço de Venda − Custo Variável`],
  ['Markup',`Índice aplicado sobre o custo de um produto ou serviço para chegar ao preço de venda, cobrindo custos fixos, impostos e a margem de lucro desejada.`],
  ['Receita',`Valor total que a empresa recebe pela venda de seus produtos ou serviços, antes de descontar qualquer custo ou despesa.`],
  ['Lucro Bruto',`O que sobra da receita depois de descontar apenas o custo direto de produzir ou comprar o que foi vendido.`,`Receita − Custo dos Produtos Vendidos (CPV)`],
  ['Lucro Líquido',`O que realmente sobra depois de descontar da receita todos os custos, despesas e impostos do negócio.`],
  ['Orçamento',`Planejamento financeiro que estima receitas e despesas de um período futuro, servindo como referência para acompanhar o desempenho real do negócio.`],
  ['Forecast',`Projeção do desempenho financeiro esperado, atualizada periodicamente conforme os dados reais vão surgindo, diferente do orçamento, que costuma ser fixo.`],
  ['DRE Gerencial',`Relatório que resume receitas, custos, despesas e lucro de um período, usado para entender se o negócio está dando lucro ou prejuízo.`]]],
 ['Vendas e Clientes',[
  ['Funil de Vendas',`Representação das etapas que um cliente percorre desde o primeiro contato até a compra, por exemplo: atenção, interesse, decisão e ação.`],
  ['Público-alvo',`Grupo de pessoas com características e necessidades em comum para quem o produto ou serviço é direcionado.`],
  ['Proposta de Valor',`A razão clara pela qual um cliente escolheria o seu produto ou serviço em vez de outra alternativa disponível no mercado.`],
  ['Ticket Médio',`Valor médio gasto por cliente em cada compra.`,`Faturamento Total ÷ Número de Vendas`],
  ['CAC (Custo de Aquisição de Cliente)',`Quanto, em média, custa conquistar um novo cliente, somando os investimentos em marketing e vendas.`,`Investimento em Aquisição ÷ Número de Novos Clientes`]]],
 ['Estratégia e Crescimento',[
  ['LTV (Valor do Cliente ao Longo do Tempo)',`Quanto, em média, um cliente gera de receita para o negócio durante todo o tempo em que compra dele.`],
  ['MVP (Produto Mínimo Viável)',`A versão mais simples de um produto ou serviço que já entrega valor real, usada para testar uma ideia antes de investir pesado nela.`],
  ['Escalabilidade',`Capacidade de um negócio crescer em receita sem que os custos cresçam na mesma proporção.`],
  ['Diferencial Competitivo',`O que torna um negócio único frente aos concorrentes. Pode ser preço, qualidade, atendimento, especialização, entre outros fatores.`],
  ['ROI (Retorno sobre Investimento)',`Mede quanto um investimento retornou em relação ao que foi gasto.`,`(Retorno − Investimento) ÷ Investimento`]]]
];
const CATS_DEF={
 PJ:[
  {n:'Vendas e serviços',g:'Receita do negócio',t:'R'},{n:'Outras receitas',g:'Receita do negócio',t:'R'},
  {n:'Custos operacionais',g:'Custos e despesas operacionais',t:'D'},{n:'Despesas administrativas',g:'Custos e despesas operacionais',t:'D'},
  {n:'Impostos e taxas',g:'Impostos',t:'D'},{n:'Pró-labore',g:'Retirada do dono',t:'D'},
  {n:'Reserva do negócio',g:'Reserva do negócio',t:'D'},{n:'Empréstimos e financiamentos do negócio',g:'Dívidas do negócio',t:'D'}],
 PF:[
  {n:'Pró-labore ou salário',g:'Receita pessoal',t:'R'},{n:'Outras receitas pessoais',g:'Receita pessoal',t:'R'},
  {n:'Moradia',g:'Despesas essenciais',t:'D'},{n:'Alimentação e mercado',g:'Despesas essenciais',t:'D'},{n:'Saúde e educação',g:'Despesas essenciais',t:'D'},
  {n:'Lazer e compras',g:'Despesas variáveis',t:'D'},{n:'Transporte',g:'Despesas variáveis',t:'D'},
  {n:'Reserva de emergência',g:'Reservas e investimentos pessoais',t:'D'},{n:'Investimentos',g:'Reservas e investimentos pessoais',t:'D'},
  {n:'Cartão e empréstimos',g:'Dívidas pessoais',t:'D'}]
};
const KINDS={PJ:[['op','Custos e despesas operacionais'],['imp','Impostos'],['pl','Retirada do dono (pró-labore)'],['res','Reserva ou investimento'],['div','Dívidas e financiamentos'],['out','Outros']],PF:[['op','Gastos do dia a dia'],['res','Reserva ou investimento'],['div','Dívidas e financiamentos'],['out','Outros']]};
function guessKind(n){n=n.toLowerCase();if(/imposto/.test(n))return 'imp';if(/retirada|pr[oó]-?labore/.test(n))return 'pl';if(/d[ií]vida|empr[eé]stimo|cart[aã]o/.test(n))return 'div';if(/reserva|investimento/.test(n))return 'res';return 'op'}
const kindOpts=(ctx,sel)=>KINDS[ctx].map(k=>`<option value="${k[0]}" ${k[0]===sel?'selected':''}>${k[1]}</option>`).join('');
const uid=()=>'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const bKey=(y,m)=>y+'-'+p2(m+1);
function defCfg(ctx){const groups=[],cats=[];CATS_DEF[ctx].forEach((c,i)=>{let g=groups.find(x=>x.n===c.g);if(!g){g={id:ctx+'g'+groups.length,n:c.g,t:c.t,kind:c.t==='R'?'rec':guessKind(c.g)};groups.push(g)}cats.push({id:ctx+'c'+i,gid:g.id,n:c.n})});return {groups,cats}}
const groupsOf=ctx=>S.fin[ctx].cfg.groups;

    const byName={};F.cfg.cats.forEach(c=>{byName[c.n]=c.id});
    F.entries.forEach(e=>{if(!F.cfg.cats.some(c=>c.id===e.cat)){if(byName[e.cat])e.cat=byName[e.cat];else{const id=uid();F.cfg.cats.push({id,gid:F.cfg.groups[0].id,n:String(e.cat),arch:true});byName[e.cat]=id;e.cat=id}}});

  });
  if(!Array.isArray(s.invTipos))s.invTipos=fresh().invTipos;

}

const TTS={ok:('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window),blocks:[],idx:0,playing:false,rate:1,tok:0,voice:null};
function pickVoice(){if(!TTS.ok)return;const vs=speechSynthesis.getVoices().filter(v=>/^pt/i.test(v.lang));TTS.voice=vs.find(v=>/natural|neural|online|google|luciana|francisca|camila|antonio/i.test(v.name)&&/BR/i.test(v.lang))||vs.find(v=>/BR/i.test(v.lang))||vs[0]||null}
if(TTS.ok){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}
function ttsStop(){TTS.tok++;TTS.playing=false;if(TTS.ok){try{speechSynthesis.cancel()}catch(e){}}}
function ttsPlay(i){
  if(!TTS.ok||!TTS.blocks.length)return;
  if(i<0)i=0; if(i>=TTS.blocks.length)i=TTS.blocks.length-1;
  try{speechSynthesis.cancel()}catch(e){}
  TTS.tok++;const t=TTS.tok;TTS.idx=i;TTS.playing=true;
  const u=new SpeechSynthesisUtterance(TTS.blocks[i]);
  u.lang='pt-BR';if(TTS.voice)u.voice=TTS.voice;u.rate=TTS.rate;
  u.onend=()=>{if(t!==TTS.tok)return;if(i+1<TTS.blocks.length)ttsPlay(i+1);else{TTS.playing=false;markRead(ui.reader,true);updatePlayer()}};
  u.onerror=()=>{if(t!==TTS.tok)return;TTS.playing=false;updatePlayer()};
  setTimeout(()=>{if(t===TTS.tok){try{speechSynthesis.speak(u)}catch(e){TTS.playing=false;updatePlayer()}}},50);
  updatePlayer(true);
}
function ttsPause(){TTS.tok++;TTS.playing=false;try{speechSynthesis.cancel()}catch(e){}updatePlayer()}
function words(t){return t.split(/\s+/).filter(Boolean).length}
function updatePlayer(scroll){
  const pb=$('#pbtn');if(!pb)return;
  pb.innerHTML=svg(TTS.playing?'pause':'play');
  pb.setAttribute('aria-label',TTS.playing?'Pausar':'Ouvir');
  document.querySelectorAll('[data-b]').forEach(el=>{const on=(+el.dataset.b===TTS.idx)&&(TTS.playing||TTS.idx>0);el.classList.toggle('on',on&&TTS.playing)});
  const tot=TTS.blocks.length||1;
  const pf=$('#pfill');if(pf)pf.style.width=Math.round((TTS.playing||TTS.idx>0?(TTS.idx+(TTS.playing?0.5:0))/tot:0)*100)+'%';
  const rem=TTS.blocks.slice(TTS.idx).reduce((a,b)=>a+words(b),0);
  const tl=$('#ptime');if(tl)tl.textContent=`${Math.max(1,Math.round(rem/(155*TTS.rate)))} min restantes · parágrafo ${TTS.idx+1} de ${tot}`;
  const sp=$('#pspeed');if(sp)sp.textContent=TTS.rate+'x';
  if(scroll&&TTS.playing){const el=document.querySelector(`[data-b="${TTS.idx}"]`);if(el){const r=el.getBoundingClientRect();if(r.top<120||r.bottom>innerHeight-220)el.scrollIntoView({block:'center',behavior:'smooth'})}}
}

function finSummary(ctx){

    if(c.t==='R'&&(c.sys==='resgate'||c.sys==='transfin'||c.sys==='divid')){rec+=e.valor;resgRec+=e.valor}

  return `<nav class="tabbar" aria-label="Navegação principal">${T.map(t=>`<button class="tab" data-act="tab" data-v="${t[0]}" ${ui.tab===t[0]?'aria-current="page"':''}><span class="ti">${svg(t[2])}</span>${t[1]}</button>`).join('')}</nav>`;

function gauge(score,color){
  const L=Math.PI*80,p=Math.max(0,Math.min(1,score/45));
  const th=Math.PI*(1-p),x=100+80*Math.cos(th),y=100-80*Math.sin(th);
  return `<div class="gauge"><svg viewBox="0 0 200 112" role="img" aria-label="Pontuação ${score} de 45"><path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="var(--track)" stroke-width="14" stroke-linecap="round"/><path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${(L*p).toFixed(1)} ${L.toFixed(1)}"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6" fill="var(--terra)" stroke="var(--surface)" stroke-width="3"/></svg><div class="gnum"><b>${score}</b><span>de 45 pontos</span></div></div>`;
}


function cardInvoice(ctx,card){
  const clamp=n=>Math.min(28,Math.max(1,n||1));
  const vencDia=clamp(card.vencDia),melhorDia=clamp(card.melhorDia||(vencDia>10?vencDia-10:vencDia+18));
  const today=new Date();today.setHours(12,0,0,0);
  const at=(y,m,d)=>new Date(y,m,d,12,0,0);
  let close=at(today.getFullYear(),today.getMonth(),melhorDia);
  if(close>today)close=at(close.getFullYear(),close.getMonth()-1,melhorDia);
  let due=at(close.getFullYear(),close.getMonth(),vencDia);
  if(due<=close)due=at(close.getFullYear(),close.getMonth()+1,vencDia);
  let guard=0;
  while(due<today&&guard<24){close=at(close.getFullYear(),close.getMonth()+1,melhorDia);due=at(close.getFullYear(),close.getMonth(),vencDia);if(due<=close)due=at(close.getFullYear(),close.getMonth()+1,vencDia);guard++}
  const prevClose=at(close.getFullYear(),close.getMonth()-1,melhorDia);
  const toISO=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
  const startISO=toISO(prevClose),endISO=toISO(close),dueISO=toISO(due);
  let total=0;
  S.fin[ctx].entries.forEach(e=>{if(e.conta!==card.id||e.date<=startISO||e.date>endISO)return;total+=catOf(ctx,e.cat).t==='R'?-e.valor:e.valor});
  const daysLeft=Math.round((due-today)/86400000);
  return {total,due:dueISO,daysLeft};
}
function cardsSection(){
  const groups=[['PJ','Negócio (PJ)'],['PF','Pessoal (PF)']].map(([ctx,label])=>{
    const cards=(S.fin[ctx].accounts||[]).filter(a=>!a.arch&&a.tipo==='cartao');
    return {ctx,label,cards};
  }).filter(g=>g.cards.length);
  if(!groups.length)return '';
  let h=`<div class="card"><h2 class="h-card" style="margin-bottom:4px">Cartões de Crédito</h2>`;
  groups.forEach(g=>{
    h+=`<p class="small" style="font-weight:600;margin:14px 0 2px"><span class="pill bdg-${g.ctx.toLowerCase()}">${g.ctx}</span> ${g.label}</p>`;
    let sub=0;
    g.cards.forEach(c=>{
      const inv=cardInvoice(g.ctx,c);sub+=inv.total;
      h+=`<div class="row between" style="padding:9px 0;border-bottom:1px solid var(--line)"><div><div style="font-weight:500">${esc(c.n)}</div><div class="small muted">vence ${inv.due.slice(8)}/${inv.due.slice(5,7)}${inv.daysLeft>=0?` · em ${inv.daysLeft} dia(s)`:' · venceu'}</div></div><b class="${inv.total<0?'neg':''}">${brl(inv.total)}</b></div>`;
    });
    if(g.cards.length>1)h+=`<div class="row between" style="padding:9px 0 2px"><span class="small" style="font-weight:600">Total ${g.label}</span><b class="${sub<0?'neg':''}">${brl(sub)}</b></div>`;
  });
  h+=`<p class="small muted" style="margin-top:10px">Estimativa com base no dia de vencimento e no melhor dia de compra cadastrados em cada cartão.</p></div>`;
  return h;
}

function viewDiag(){
  const D=S.diag,all=D.answers.every(a=>a!==null);
  if(ui.diagMode==='result'&&all){
    const sc=diagScore(D.answers),l=level(sc),ss=secScores(D.answers);
    let w=0;ss.forEach((v,i)=>{if(v<ss[w])w=i});
    const H=D.history,prev=H.length>1?H[H.length-2]:null;
    let h=`<h1 class="h-page">Seu resultado</h1><div class="card">${gauge(sc,l.c)}<div class="lvl" style="color:${l.c}">${l.n}</div><p class="sub" style="margin-top:8px">${esc(l.rec)}</p><p style="font-weight:600;margin:10px 0 0">${esc(l.cta)}</p>${prev?`<p class="small" style="text-align:center;margin:10px 0 0">${sc-prev.score>=0?'+':''}${sc-prev.score} ponto(s) desde o último diagnóstico</p>`:''}</div>`;
    h+=`<div class="card"><h2 class="h-card">Pontuação por área</h2>${ss.map((v,i)=>`<div style="margin:12px 0"><div class="row between small"><span>${SEC[i]}</span><b>${v}/9</b></div><div class="bar ${i===w?'terra':''}" style="margin-top:6px"><i style="width:${v/9*100}%"></i></div></div>`).join('')}</div>`;
    const g=GUIDES.find(x=>x.sec===w);
    h+=`<div class="card"><h2 class="h-card">Por onde começar</h2><p class="sub">A área com menor pontuação é <b>${SEC[w].toLowerCase()}</b>.</p><div style="margin-top:12px"><button class="btn block" data-act="open" data-v="${g.id}">${svg('headph')} Ler ou ouvir o ${esc(g.sub)}</button></div></div>`;
    if(H.length){h+=`<div class="card"><h2 class="h-card">Histórico</h2>${H.slice().reverse().map(x=>`<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>${x.date.slice(8)}/${x.date.slice(5,7)}/${x.date.slice(0,4)}</span><span><b>${x.score}</b> · ${level(x.score).n}</span></div>`).join('')}</div>`}
    h+=`<button class="btn sec block" data-act="redo">Refazer o diagnóstico</button><p class="disc">Sugestão: refaça a cada 30 dias para acompanhar a sua evolução.</p>`;
    return h;
  }
  const s=ui.diagSec;const done=[0,1,2].every(k=>D.answers[s*3+k]!==null);
  const answered=D.answers.filter(a=>a!==null).length;
  let h=`<h1 class="h-page">Diagnóstico</h1><p class="sub">Marque a alternativa que mais se aproxima da sua realidade atual, sem se julgar. Não existe resposta certa ou errada.</p>`;
  h+=`<div class="card"><div class="row between small muted"><span>Área ${s+1} de 5</span><span>${answered} de 15 respondidas</span></div><div class="bar" style="margin:8px 0 14px"><i style="width:${answered/15*100}%"></i></div><h2 class="h-card">${SEC[s]}</h2><p class="small muted" style="margin:0 0 4px;font-style:italic">${SECI[s]}</p>`;
  for(let k=0;k<3;k++){const qi=s*3+k;
    h+=`<div class="q"><div style="font-size:16.5px">${esc(QS[qi])}</div><div class="opts" role="group" aria-label="Resposta">${OPTS.map((o,v)=>`<button class="opt" data-act="ans" data-q="${qi}" data-v="${v}" aria-pressed="${D.answers[qi]===v}">${o}</button>`).join('')}</div></div>`;
  }
  h+=`</div><div class="row">`;
  if(s>0)h+=`<button class="btn sec" data-act="dsec" data-v="${s-1}">Voltar</button>`;
  h+=`<div class="grow"><button class="btn block" data-act="${s<4?'dsec':'finish'}" data-v="${s+1}" ${done?'':'disabled'}>${s<4?'Próxima área':'Ver meu resultado'}</button></div></div>`;
  return h;
}

const MES3=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
function monthly(ctx){const r=Array(12).fill(0),d=Array(12).fill(0);S.fin[ctx].entries.forEach(e=>{const dt=new Date(e.date+'T12:00:00');if(dt.getFullYear()!==ui.year)return;const m=dt.getMonth();if(catOf(ctx,e.cat).t==='R')r[m]+=e.valor;else d[m]+=e.valor});return {r,d}}
const pct1=n=>n.toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';
function chartMonths(ctx){
  const m=monthly(ctx);const max=Math.max(1,...m.r,...m.d);
  const W=340,H=176,pl=6,pb=22,pt=8,gw=(W-pl*2)/12,bw=9,ch=H-pb-pt;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Receitas e despesas por mês">`;
  for(let i=0;i<12;i++){
    const x0=pl+i*gw;
    if(ui.period===String(i))s+=`<rect x="${x0+1}" y="${pt}" width="${gw-2}" height="${ch}" rx="5" style="fill:var(--surface2)"/>`;
    const hr=m.r[i]/max*ch,hd=m.d[i]/max*ch;
    s+=`<rect x="${(x0+gw/2-bw-1).toFixed(1)}" y="${(pt+ch-hr).toFixed(1)}" width="${bw}" height="${hr.toFixed(1)}" rx="2" style="fill:var(--sage-d)"/>`;
    s+=`<rect x="${(x0+gw/2+1).toFixed(1)}" y="${(pt+ch-hd).toFixed(1)}" width="${bw}" height="${hd.toFixed(1)}" rx="2" style="fill:var(--terra-m)"/>`;
    s+=`<text x="${(x0+gw/2).toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="10" style="fill:var(--ink2)">${MES3[i][0]}</text>`;
  }
  s+=`<line x1="${pl}" x2="${W-pl}" y1="${pt+ch}" y2="${pt+ch}" style="stroke:var(--line)" stroke-width="1"/></svg>`;
  return s;
}
function chartAcum(ctx){
  const m=monthly(ctx);let last=-1;for(let i=0;i<12;i++)if(m.r[i]||m.d[i])last=i;
  if(last<0)return '';
  const acc=[];let a=0;for(let i=0;i<=last;i++){a+=m.r[i]-m.d[i];acc.push(a)}
  const mn=Math.min(0,...acc),mx=Math.max(0,...acc),rng=(mx-mn)||1;
  const W=340,H=160,pl=12,pr=12,pt=22,pb=24;
  const X=i=>last===0?W/2:pl+(W-pl-pr)*i/last, Y=v=>pt+(H-pt-pb)*(1-(v-mn)/rng);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Resultado acumulado no ano">`;
  s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke-dasharray="4 4" style="stroke:var(--line)" stroke-width="1.5"/>`;

function waterfall(sm){
  const rec=sm.rec-sm.resgRec;
  if(rec<=0)return '';
  const k=sm.k,lo=rec-k.op-k.imp,ll=lo-k.pl,out=k.res+k.div+k.out;
  const rows=[['Faturamento',rec,1],['− Custos e despesas operacionais',-k.op],['− Impostos',-k.imp],['= Lucro operacional',lo,1],['− Retirada do dono (pró-labore)',-k.pl],['= Lucro líquido',ll,1]];
  if(sm.resgRec>0)rows.push(['+ Resgates de investimentos',sm.resgRec]);
  rows.push(['− Reserva, dívidas e outros',-out],['= Sobra em caixa',sm.res,1]);
  return `<div class="card"><h2 class="h-card">Do faturamento ao lucro</h2><p class="small muted" style="margin:0 0 6px">Por onde o dinheiro passa até virar lucro. Resgates de investimentos não contam como faturamento.</p>${rows.map(r=>{const w=Math.min(100,Math.abs(r[1])/rec*100);return `<div class="wf"><div class="row between"><span style="${r[2]?'font-weight:600':''}">${r[0]}</span><b class="${r[1]<0&&r[2]?'neg':''}">${brl(r[1])}</b></div><div class="bar ${r[2]?(r[1]<0?'neg':''):'terra'}" style="height:7px;margin-top:4px"><i style="width:${w}%"></i></div></div>`}).join('')}</div>`;
}

function budgetAction(act){
  const ctx=ui.ctx,F=S.fin[ctx],y=ui.bY,m=ui.bM,k=bKey(y,m);
  const has=o=>o&&Object.keys(o).some(id=>o[id]>0);
  const clone=o=>JSON.parse(JSON.stringify(o||{}));
  if(act==='copyprev'){
    const pk=m===0?bKey(y-1,11):bKey(y,m-1);
    if(!has(F.budgetM[pk])){toast('O mês anterior não tem orçamento para copiar');return}
    if(has(F.budgetM[k])&&ui.confirm!=='copyprev'){ui.confirm='copyprev';render();return}
    F.budgetM[k]=clone(F.budgetM[pk]);toast('Orçamento de '+MES[m]+' copiado do mês anterior');
  }else if(act==='copynext'){
    if(!has(F.budgetM[k])){toast('Preencha o orçamento deste mês primeiro');return}
    let any=false;for(let i=m+1;i<12;i++)if(has(F.budgetM[bKey(y,i)]))any=true;
    if(any&&ui.confirm!=='copynext'){ui.confirm='copynext';render();return}
    for(let i=m+1;i<12;i++)F.budgetM[bKey(y,i)]=clone(F.budgetM[k]);toast('Orçamento aplicado de '+MES[m]+' até Dezembro');
  }else{
    if(has(F.budgetM[k])&&ui.confirm!=='clearm'){ui.confirm='clearm';render();return}
    F.budgetM[k]={};toast('Orçamento de '+MES[m]+' limpo');
  }
  ui.confirm=null;save();render();
}
