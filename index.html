const invName=(ctx,id)=>{const i=(S.fin[ctx].invs||[]).find(x=>x.id===id);return i?i.n:'Investimento removido'};
function periodRange(){if(ui.period==='all')return [ui.year+'-01-01',ui.year+'-12-31'];const m=+ui.period,last=new Date(ui.year,m+1,0).getDate();return [bKey(ui.year,m)+'-01',bKey(ui.year,m)+'-'+p2(last)]}
const invUsed=(ctx,id)=>S.fin[ctx].entries.some(e=>e.inv===id)||S.fin[ctx].invRecs.some(r=>r.inv===id);
function invItems(scope,tipo){
  const out=[];
  ['PJ','PF'].forEach(ctx=>{
    if(scope!=='ALL'&&scope!==ctx)return;
    const F=S.fin[ctx],res={};allCats(ctx).forEach(c=>{if(c.kind==='res')res[c.id]=1});
    F.invs.filter(i=>!i.arch||invUsed(ctx,i.id)).forEach(i=>out.push({ctx,inv:i}));
    if(F.entries.some(e=>!e.inv&&res[e.cat])||F.invRecs.some(r=>!r.inv))out.push({ctx,inv:{id:'',n:'Não especificado',tipo:'Sem tipo'}});
  });
  return (tipo&&tipo!=='ALL')?out.filter(x=>x.inv.tipo===tipo):out;
}
const invFind=(ctx,id)=>id===''?{id:'',n:'Não especificado',tipo:'Sem tipo'}:(S.fin[ctx].invs.find(i=>i.id===id)||{id,n:'Investimento removido',tipo:'Sem tipo'});
function invRun(ctx,inv,extra){
  const F=S.fin[ctx],res={};allCats(ctx).forEach(c=>{if(c.kind==='res')res[c.id]=1});
  const evs=[];
  if(inv.saldoIni>0)evs.push({d:inv.dataIni||'0000-00-00',t:'open',v:inv.saldoIni,o:0});
  F.entries.forEach(e=>{if((e.inv||'')===inv.id&&res[e.cat]&&e.pago)evs.push({d:e.date,t:'apo',v:e.valor,o:1})});
  F.invRecs.forEach(r=>{if(r.inv===inv.id)evs.push({d:r.date,t:r.tipo==='resg'?'resg':(r.tipo==='saldo'?'saldo':(r.tipo==='div'?'div':'rend')),v:r.valor,id:r.id,o:r.tipo==='saldo'?4:(r.tipo==='resg'?2:(r.tipo==='div'?5:3)),ganho:r.tipo==='resg'?r.ganho:undefined,qtdVend:r.tipo==='resg'?r.qtdVend:undefined,taxas:r.tipo==='resg'?r.taxas:undefined,custoVend:r.tipo==='resg'?r.custoVend:undefined})});
  if(extra)evs.push(Object.assign({o:extra.t==='saldo'?4:3},extra));
  evs.sort((a,b)=>a.d<b.d?-1:(a.d>b.d?1:a.o-b.o));
  let P=0;
  evs.forEach(e=>{if(e.t==='open'||e.t==='apo')P+=e.v;else if(e.t==='resg')P-=e.v;else if(e.t==='rend')P+=e.v;else if(e.t==='div'){}else{e.pre=P;e.y=e.v-P;P=e.v}});
  return {evs,pos:P};
}
function invCalc(ctx,inv,start,end){
  const t=todayISO(),e2=end>t?t:end,run=invRun(ctx,inv);
  let ini=0,ap=0,rp=0,gp=0,dp=0,cg=0,ccg=0;
  run.evs.forEach(e=>{
    if(e.d>e2)return;
    if(e.t==='open'){ini+=e.v;return}
    if(e.t==='div'){if(e.d>=start)dp+=e.v;return}
    if(e.t==='resg'&&e.ganho!=null&&e.d>=start){cg+=e.ganho;ccg+=(e.custoVend!=null?e.custoVend:(e.v-(e.taxas||0)-e.ganho))}
    const eff=e.t==='apo'?e.v:(e.t==='resg'?-e.v:(e.t==='rend'?e.v:e.y));
    if(e.d<start){ini+=eff;return}
    if(e.t==='apo')ap+=e.v;else if(e.t==='resg')gp+=e.v;else rp+=(e.t==='rend'?e.v:e.y);
  });
  return {ini,apo:ap,rend:rp,resg:gp,divid:dp,ganhoCap:cg,custoGanhoCap:ccg,fin:ini+ap+rp-gp,base:ini+ap};
}
function resgateCat(ctx){
  const F=S.fin[ctx];let c=F.cfg.cats.find(x=>x.sys==='resgate');
  if(c){delete c.arch;return c.id}
  let g=F.cfg.groups.find(x=>x.t==='R');
  if(!g){g={id:uid(),n:ctx==='PJ'?'Receita do negócio':'Receita pessoal',t:'R',kind:'rec'};F.cfg.groups.push(g)}
  c={id:uid(),gid:g.id,n:'Resgate de investimentos',sys:'resgate'};F.cfg.cats.push(c);return c.id;
}
function dividCat(ctx){
  const F=S.fin[ctx];let c=F.cfg.cats.find(x=>x.sys==='divid');
  if(c){delete c.arch;return c.id}
  let g=F.cfg.groups.find(x=>x.t==='R');
  if(!g){g={id:uid(),n:ctx==='PJ'?'Receita do negócio':'Receita pessoal',t:'R',kind:'rec'};F.cfg.groups.push(g)}
  c={id:uid(),gid:g.id,n:'Dividendos recebidos',sys:'divid'};F.cfg.cats.push(c);return c.id;
}
function invPreview(){

      }else if(puCalc){puCalc.textContent=`Você tem ${inv.qtd.toLocaleString('pt-BR',{maximumFractionDigits:4})} un. cadastradas. Informe o preço atual para o app calcular o saldo, ou preencha o saldo diretamente abaixo.`;puCalc.className='small muted';}
    }

  const v=parseNum($('#ir_val').value),d=$('#ir_date').value;
  if(tipo==='saldo'){
    if(isNaN(v)||!d){p.innerHTML='Informe o saldo que aparece no extrato. O app compara com o valor esperado (saldo anterior + aportes − resgates) e calcula o rendimento sozinho.';return}
    const r=invRun(ctx,inv,{id:'__new',d,t:'saldo',v}),ev=r.evs.find(e=>e.id==='__new');

  }else if(tipo==='resg'){

      }else{
        extra=`<br><span class="muted">Cadastre as compras deste investimento (quantidade e preço) para o app calcular o ganho de capital automaticamente.</span>`;
      }
    }
    p.innerHTML=`Será lançado como <b>receita</b> ${ctx==='PJ'?'no módulo Negócio (PJ)':'no módulo Pessoal (PF)'}, na categoria “Resgate de investimentos”.${!isNaN(v)&&v>pos?`<br><span class="neg">O valor é maior que o saldo calculado (${brl(pos)}).</span>`:''}${extra}`;
  }else if(tipo==='div'){
    p.innerHTML=`Será lançado como <b>receita</b> ${ctx==='PJ'?'no módulo Negócio (PJ)':'no módulo Pessoal (PF)'}, na categoria “Dividendos recebidos”. Aparece no card do investimento, mas não entra no saldo final dele.`;
  }else p.innerHTML='O valor informado soma ao saldo do investimento como rendimento.';
}
function invAgg(items,start,end){
  const a={ini:0,apo:0,rend:0,resg:0,fin:0};
  items.forEach(x=>{const c=invCalc(x.ctx,x.inv,start,end);x.c=c;for(const k in a)a[k]+=c[k]});
  a.base=a.ini+a.apo;a.pct=a.base>0?a.rend/a.base*100:null;return a;
}
function lineSvg(vals,lastLabel){
  const last=vals.length-1;if(last<0)return '';
  const mn=Math.min(0,...vals),mx=Math.max(0,...vals),rng=(mx-mn)||1;
  const W=340,H=160,pl=12,pr=12,pt=22,pb=24;
  const X=i=>last===0?W/2:pl+(W-pl-pr)*i/last,Y=v=>pt+(H-pt-pb)*(1-(v-mn)/rng);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolução da carteira">`;
  s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke-dasharray="4 4" style="stroke:var(--line)" stroke-width="1.5"/>`;
  if(last>0)s+=`<polyline fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--pri)" points="${vals.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')}"/>`;
  vals.forEach((v,i)=>{s+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${i===last?5:3.5}" style="fill:${i===last?'var(--terra)':'var(--pri)'}"/>`;
    if(last<=5||i%2===0||i===last)s+=`<text x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10" style="fill:var(--ink2)">${MES3[i]}</text>`});
  const lx=X(last);s+=`<text x="${lx.toFixed(1)}" y="${(Y(vals[last])-10).toFixed(1)}" text-anchor="${lx>W-70?'end':'middle'}" font-size="12" font-weight="600" style="fill:var(--ink)">${lastLabel}</text></svg>`;
  return s;
}

function invPurchases(ctx,inv){
  const list=[];
  if(inv.qtd>0&&inv.preco>0)list.push({date:inv.dataIni||'',qtd:inv.qtd,preco:inv.preco,origem:'Cadastro inicial'});
  (S.fin[ctx].entries||[]).forEach(e=>{if(e.inv===inv.id&&e.invQtd>0&&e.invPreco>0&&e.pago)list.push({date:e.date,qtd:e.invQtd,preco:e.invPreco,origem:'Compra',id:e.id});});
  list.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const totalQtd=list.reduce((a,x)=>a+x.qtd,0),totalCusto=list.reduce((a,x)=>a+x.qtd*x.preco,0);
  const qtdVendida=(S.fin[ctx].invRecs||[]).filter(r=>r.inv===inv.id&&r.tipo==='resg'&&r.qtdVend>0).reduce((a,r)=>a+r.qtdVend,0);
  const qtdPos=Math.max(0,totalQtd-qtdVendida);
  return {list,totalQtd,avgPreco:totalQtd>0?totalCusto/totalQtd:null,qtdVendida,qtdPos};
}


const RF_TIPOS=['Poupança','CDB','Tesouro Direto','LCI / LCA','Previdência'];
function invRiskClass(tipo){return RF_TIPOS.includes(tipo)?'Renda fixa':'Renda variável'}

function goalRate(g){return g.taxaPer==='aa'?Math.pow(1+g.taxa/100,1/12)-1:g.taxa/100}
function monthsBetween(a,b){const A=a.split('-').map(Number),B=b.split('-').map(Number);return (B[0]-A[0])*12+(B[1]-A[1])+(B[2]>=A[2]?0:0)}
function goalAllocSum(g){
  const F=S.fin[g.ctx];let sum=0;
  F.entries.forEach(e=>{if(!e.goals||!e.pago)return;const a=e.goals.find(x=>x.id===g.id);if(a)sum+=e.valor*a.pct/100});
  return sum;
}
function goalRealized(g){return (g.ini||0)+goalAllocSum(g)}
function goalMonthlyRealized(g,nowOff){
  const F=S.fin[g.ctx],arr=Array(nowOff+1).fill(0);
  if(g.ini>0){const mi=Math.max(0,monthsBetween(g.dataIni,g.iniDate||g.dataIni));if(mi<=nowOff)arr[mi]+=g.ini}
  F.entries.forEach(e=>{if(!e.goals||!e.pago)return;const a=e.goals.find(x=>x.id===g.id);if(!a)return;const m=monthsBetween(g.dataIni,e.date);if(m>=0&&m<=nowOff)arr[m]+=e.valor*a.pct/100});
  let acc=0;return arr.map(v=>acc+=v);
}
function goalPlanCurve(g,months){
  const i=goalRate(g),arr=[g.ini||0];let bal=g.ini||0;
  for(let m=1;m<=months;m++){bal=bal*(1+i)+g.aporte;arr.push(bal)}
  return arr;
}
function goalProjection(g){
  const i=goalRate(g),nowOff=Math.max(0,monthsBetween(g.dataIni,todayISO()));
  let bal=goalRealized(g);
  if(bal>=g.valor)return {reached:true,monthsLeft:0,date:todayISO(),bal};
  if(g.aporte<=0&&i<=0)return {reached:false,never:true,bal};
  let m=0;const cap=1200;
  while(bal<g.valor&&m<cap){bal=bal*(1+i)+g.aporte;m++}
  if(m>=cap)return {reached:false,never:true,bal};
  return {reached:false,monthsLeft:m,date:addMonths(todayISO(),m),bal};
}
function goalRequiredAporte(g){
  if(!g.dataAlvo)return null;
  const n=monthsBetween(todayISO(),g.dataAlvo);if(n<=0)return null;
  const i=goalRate(g),bal=goalRealized(g);
  if(i===0)return Math.max(0,(g.valor-bal)/n);
  const fvBal=bal*Math.pow(1+i,n);
  if(fvBal>=g.valor)return 0;
  return (g.valor-fvBal)*i/(Math.pow(1+i,n)-1);
}
function goalTimelineSvg(real,plan,target){
  const n=Math.max(real.length,plan.length),mx=Math.max(target,...real,...plan);
  const W=340,H=176,pl=8,pr=8,pt=10,pb=20,ch=H-pt-pb;
  const X=idx=>n<=1?W/2:pl+(W-pl-pr)*idx/(n-1),Y=v=>pt+ch*(1-Math.min(1,v/mx));
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Planejado x realizado">`;
  s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(target).toFixed(1)}" y2="${Y(target).toFixed(1)}" stroke-dasharray="3 4" style="stroke:var(--terra)" stroke-width="1.5"/>`;
  if(plan.length>1)s+=`<polyline fill="none" stroke-width="2.5" stroke-dasharray="5 4" style="stroke:var(--ink2)" points="${plan.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')}"/>`;
  if(real.length>1)s+=`<polyline fill="none" stroke-width="3" stroke-linecap="round" style="stroke:var(--pri)" points="${real.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')}"/>`;
  if(real.length)s+=`<circle cx="${X(real.length-1).toFixed(1)}" cy="${Y(real[real.length-1]).toFixed(1)}" r="5" style="fill:var(--terra)"/>`;
  s+=`</svg>`;
  return s;
}

function goalCard(g){
  const real=goalRealized(g),pct=g.valor>0?Math.min(100,real/g.valor*100):0;
  const proj=goalProjection(g),req=goalRequiredAporte(g);
  const nowOff=Math.max(0,monthsBetween(g.dataIni,todayISO()));
  const realArr=goalMonthlyRealized(g,nowOff);
  const planMonths=proj.reached?nowOff:Math.min(nowOff+(proj.never?24:proj.monthsLeft),240);
  const planArr=goalPlanCurve(g,planMonths);
  let status;
  if(proj.reached)status=`<span class="pill ok">Meta atingida 🎉</span>`;
  else if(proj.never)status=`<span class="pill">Sem projeção com os valores atuais</span>`;
  else status=`<span class="pill ok">Previsão com o aporte atual: ${MES[new Date(proj.date+'T12:00:00').getMonth()]} de ${proj.date.slice(0,4)} (${proj.monthsLeft} ${proj.monthsLeft===1?'mês':'meses'})</span>`;
  const st=goalStatus(g);
  return `<div class="card"><div class="row between" style="align-items:flex-start"><div class="grow"><b style="font-size:17px">${svg('flag')} ${esc(g.n)}</b><div class="row" style="gap:6px;margin-top:6px">${status}<span class="pill bdg-${g.ctx.toLowerCase()}">${g.ctx}</span></div></div></div>
  ${(g.aporte<=0&&g.dataAlvo&&req!==null&&req>0)?`<div class="row" style="gap:8px;align-items:center;background:var(--surface2);border-left:4px solid var(--ink2);border-radius:10px;padding:9px 12px;margin-top:10px"><span class="small">Sem aporte mensal definido, a previsão acima considera só os juros. Para chegar até a data alvo, seriam necessários ${brl(req)} por mês.</span></div>`:''}
  <div class="bar" style="margin:12px 0 4px"><i style="width:${pct}%"></i></div>
  <div class="row between small"><span>${brl(real)} guardado</span><span class="muted">${pct1(pct)} de ${brl(g.valor)}</span></div>
  ${st.behind?`<div class="row" style="gap:8px;align-items:center;background:var(--pf-soft);border-left:4px solid var(--neg);border-radius:10px;padding:9px 12px;margin-top:10px"><span style="font-size:17px">⚠️</span><span class="small" style="color:var(--ink)">Atrasado em relação ao planejado: faltam <b>${brl(-st.diff)}</b> para acompanhar o ritmo previsto até este mês.</span></div>`:''}
  ${goalTimelineSvg(realArr,planArr,g.valor)}
  <div class="row small" style="gap:16px;margin:2px 0 6px"><span><span class="dot" style="background:var(--pri)"></span>Realizado</span><span><span class="dot" style="background:var(--ink2)"></span>Planejado</span></div>
  <div class="grid2 small" style="gap:8px"><div class="muted">Aporte mensal planejado<br><b style="color:var(--ink)">${brl(g.aporte)}</b></div><div class="muted">Taxa estimada<br><b style="color:var(--ink)">${g.taxa}% ${g.taxaPer==='aa'?'ao ano':'ao mês'}</b></div>
  ${g.dataAlvo?`<div class="muted">Data alvo<br><b style="color:var(--ink)">${g.dataAlvo.slice(8)}/${g.dataAlvo.slice(5,7)}/${g.dataAlvo.slice(0,4)}</b></div><div class="muted">Aporte necessário p/ essa data<br><b class="${req!==null&&req>g.aporte?'neg':'pos'}" style="${req===null?'color:var(--ink)':''}">${req===null?'data já passou':brl(req)}</b></div>`:''}</div>
  <div style="margin-top:12px"><button class="btn ghost small" data-act="editgoal" data-v="${g.id}">Editar objetivo</button></div></div>`;
}

function goalStatus(g){
  const nowOff=Math.max(0,monthsBetween(g.dataIni,todayISO()));
  const planNow=goalPlanCurve(g,nowOff)[nowOff];
  const real=goalRealized(g);
  const diff=real-planNow;
  const behind=diff<-0.01&&real<g.valor&&planNow>0.01;
  return {behind,diff,planNow,real};
}
function goalsBehind(scope){return S.goals.filter(g=>(!scope||scope==='ALL'||g.ctx===scope)&&goalStatus(g).behind)}

const BANDEIRAS=['Visa','Mastercard','Elo','American Express','Outra'];
function allAccounts(scope){const out=[];['PJ','PF'].forEach(ctx=>{if(scope&&scope!=='ALL'&&scope!==ctx)return;(S.fin[ctx].accounts||[]).forEach(a=>out.push(Object.assign({ctx},a)))});return out}
const accFind=(ctx,id)=>(S.fin[ctx].accounts||[]).find(a=>a.id===id);
function accName(ctx,id){const a=accFind(ctx,id);return a?a.n:'Conta removida'}
function accCalc(ctx,a){
  const F=S.fin[ctx];let bal=a.saldoIni||0;
  F.entries.forEach(e=>{if(e.conta!==a.id||!e.pago)return;if(a.dataIni&&e.date<a.dataIni)return;bal+=catOf(ctx,e.cat).t==='R'?e.valor:-e.valor});
  return bal;
}
const accUsed=(ctx,id)=>S.fin[ctx].entries.some(e=>e.conta===id);
function transfCat(ctx,dir){
  const F=S.fin[ctx],sysTag=dir==='out'?'transfout':'transfin';
  let c=F.cfg.cats.find(x=>x.sys===sysTag);if(c){delete c.arch;return c.id}
  const gname=dir==='out'?'Transferências enviadas':'Transferências recebidas',gt=dir==='out'?'D':'R';

}

function saveRecur(){
  const err=$('#rc_err'),ctx=ui.ctx,F=S.fin[ctx];

function saveTransfer(){
  const err=$('#tf_err');
  const o=$('#tf_from').value,d=$('#tf_to').value;
  if(!o||!d){err.textContent='Escolha as duas contas.';return}
  if(o===d){err.textContent='A conta de origem e a de destino precisam ser diferentes.';return}
  const v=parseNum($('#tf_val').value),date=$('#tf_date').value,desc=$('#tf_desc').value.trim();
  if(!(v>0)){err.textContent='Informe um valor maior que zero.';return}

const IMP_HEADERS=["Módulo","Data","Tipo","Categoria","Valor","Descrição","Fixo ou Variável","Conta ou Cartão","Parcela atual","Total de parcelas","Produto ou Serviço","Quantidade"];
const IMP_EXAMPLES=[
 ["PJ","05/09/2026","Receita","Vendas e serviços","450","Cliente Ana Paula","","Conta PJ","1","1","Consultoria financeira","1"],
 ["PJ","10/09/2026","Despesa","Custos operacionais","320","Plataforma e taxas","Variável","Cartão Business","1","1","",""],
 ["PF","05/09/2026","Despesa","Moradia","1400","Aluguel","Fixo","Conta Nubank","1","3","",""]
];
function downloadTemplateCSV(){
  const rows=[IMP_HEADERS,...IMP_EXAMPLES];
  const csv=rows.map(r=>r.map(csvEsc).join(';')).join('\r\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='fortera-controle-modelo-importacao.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function csvEsc(v){v=String(v==null?'':v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function splitCSVLine(line,d){
  const out=[];let cur='',inQ=false;
  for(let i=0;i<line.length;i++){const ch=line[i];
    if(inQ){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++}else inQ=false}else cur+=ch}
    else{if(ch==='"')inQ=true;else if(ch===d){out.push(cur);cur=''}else cur+=ch}}
  out.push(cur);return out;
}
const normTxt=s=>String(s==null?'':s).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function parseImpDate(s){
  s=String(s||'').trim();
  const valid=(y,mo,d)=>{if(mo<1||mo>12||d<1)return false;const dim=[31,((y%4===0&&y%100!==0)||y%400===0)?29:28,31,30,31,30,31,31,30,31,30,31];return d<=dim[mo-1]};
  let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m){const d=+m[1],mo=+m[2],y=+m[3];if(!valid(y,mo,d))return null;return y+'-'+p2(mo)+'-'+p2(d)}
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m){const y=+m[1],mo=+m[2],d=+m[3];if(!valid(y,mo,d))return null;return y+'-'+p2(mo)+'-'+p2(d)}
  return null;
}
const IMP_HMAP={'modulo':'ctx','data':'date','tipo':'tipo','categoria':'cat','valor':'valor','descricao':'desc','fixo ou variavel':'fv','conta ou cartao':'conta','parcela atual':'pa','total de parcelas':'pt','produto ou servico':'prod','quantidade':'qtd'};
function resolveCatId(ctx,name,tipoHint,create){
  const nn=normTxt(name);
  const found=allCats(ctx).find(c=>normTxt(c.n)===nn);
  if(found){if(found.arch&&create)delete found.arch;return {id:found.id,isNew:false}}
  if(!create)return {id:null,isNew:true};
  const F=S.fin[ctx],t=tipoHint==='receita'?'R':'D';
  let g=F.cfg.groups.find(x=>x.n==='Importados'&&x.t===t);
  if(!g){g={id:uid(),n:'Importados',t,kind:t==='R'?'rec':'op'};F.cfg.groups.push(g)}
  const c={id:uid(),gid:g.id,n:name};F.cfg.cats.push(c);
  return {id:c.id,isNew:true};
}
function handleImportFile(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{try{parseImportCSV(String(reader.result))}catch(e){ui.importError='Não foi possível ler este arquivo. Confira se é um CSV válido (o modelo baixado pelo app funciona direto).';ui.importRows=null;render()}};
  reader.onerror=()=>{ui.importError='Não foi possível ler este arquivo.';render()};
  reader.readAsText(file,'UTF-8');
}
function parseImportCSV(text){
  ui.importError=null;
  text=text.replace(/^\uFEFF/,'');
  const lines=text.split(/\r\n|\n|\r/).filter(l=>l.trim()!=='');
  if(lines.length<2){ui.importError='O arquivo está vazio ou só tem o cabeçalho.';ui.importRows=null;render();return}
  const semi=(lines[0].match(/;/g)||[]).length,comma=(lines[0].match(/,/g)||[]).length;
  const delim=semi>=comma?';':',';
  const head=splitCSVLine(lines[0],delim).map(normTxt);
  const colIdx={};head.forEach((h,i)=>{if(IMP_HMAP[h])colIdx[IMP_HMAP[h]]=i});
  if(colIdx.cat===undefined||colIdx.valor===undefined||colIdx.date===undefined){
    ui.importError='Não encontrei as colunas “Data”, “Categoria” e “Valor” no cabeçalho. Use o modelo baixado pelo app.';ui.importRows=null;render();return;
  }
  const rows=[],warnings=[];
  for(let li=1;li<lines.length;li++){
    const f=splitCSVLine(lines[li],delim);
    const get=k=>colIdx[k]!==undefined?(f[colIdx[k]]||'').trim():'';
    const lineNo=li+1;
    let ctx=get('ctx').toUpperCase();if(ctx!=='PJ'&&ctx!=='PF')ctx=ui.ctx;
    const date=parseImpDate(get('date'));
    const catName=get('cat');
    const valor=parseNum(get('valor'));
    if(!date){warnings.push(`Linha ${lineNo}: data inválida, linha ignorada.`);continue}
    if(!catName){warnings.push(`Linha ${lineNo}: categoria em branco, linha ignorada.`);continue}
    if(!(valor>0)){warnings.push(`Linha ${lineNo}: valor inválido ou zero, linha ignorada.`);continue}
    const tipoRaw=normTxt(get('tipo'));
    const tipoHint=tipoRaw.startsWith('rec')?'receita':(tipoRaw.startsWith('desp')?'despesa':'');
    const catCheck=resolveCatId(ctx,catName,tipoHint,false);
    if(catCheck.isNew)warnings.push(`Linha ${lineNo}: categoria “${catName}” não existe e será criada em “Importados” (${ctx}).`);
    let fv=get('fv');fv=/fixo/i.test(fv)?'Fixo':'Variável';
    let pa=parseInt(get('pa'),10);if(!(pa>=1))pa=1;
    let pt=parseInt(get('pt'),10);if(!(pt>=1))pt=1;if(pa>pt)pt=pa;
    const contaName=get('conta');let contaOk=true;
    if(contaName){const ac=(S.fin[ctx].accounts||[]).find(a=>normTxt(a.n)===normTxt(contaName));if(!ac){contaOk=false;warnings.push(`Linha ${lineNo}: conta/cartão “${contaName}” não encontrada, importado sem conta.`)}}
    const prodName=get('prod');let prodOk=true;
    if(prodName){const pr=(S.fin.PJ.products||[]).find(p=>normTxt(p.n)===normTxt(prodName));if(!pr){prodOk=false;if(ctx==='PJ')warnings.push(`Linha ${lineNo}: produto/serviço “${prodName}” não encontrado, importado sem produto.`)}}
    let qtd=parseNum(get('qtd'));if(!(qtd>0))qtd=1;
    rows.push({lineNo,ctx,date,catName,tipoHint,valor,desc:get('desc'),fv,pa,pt,contaName:contaOk?contaName:'',prodName:(ctx==='PJ'&&prodOk)?prodName:'',qtd});
  }
  ui.importRows=rows;ui.importWarnings=warnings;
  ui.importCounts={total:rows.length,PJ:rows.filter(r=>r.ctx==='PJ').length,PF:rows.filter(r=>r.ctx==='PF').length};
  render();
}
function confirmImport(){
  const rows=ui.importRows||[];let n=0,base=Date.now();
  rows.forEach((r,i)=>{
    const cc=resolveCatId(r.ctx,r.catName,r.tipoHint,true);
    const F=S.fin[r.ctx];
    let conta;if(r.contaName){const ac=(F.accounts||[]).find(a=>normTxt(a.n)===normTxt(r.contaName));if(ac)conta=ac.id}
    let prod;if(r.prodName){const pr=(S.fin.PJ.products||[]).find(p=>normTxt(p.n)===normTxt(r.prodName));if(pr)prod=pr.id}
    F.entries.push({id:base+i,date:r.date,cat:cc.id,desc:r.desc,valor:r.valor,fv:r.fv,pa:r.pa,pt:r.pt,qtd:r.qtd,conta:conta||undefined,prod:prod||undefined,pago:r.date<=todayISO()});
    n++;
  });
  save();ui.importRows=null;ui.importWarnings=null;ui.importCounts=null;ui.finTab='lanc';ui.page=null;
  render(true);toast(`${n} lançamento${n===1?'':'s'} importado${n===1?'':'s'}`);
}
function viewImport(){
  let h=`<div class="rd-top"><button class="iconbtn" data-act="closepage" aria-label="Voltar">${svg('back')}</button><div class="grow" style="font-weight:600">Importar lançamentos</div></div><div style="padding:8px 18px 60px">`;

    if(ui.importWarnings.length){h+=`<p class="small" style="margin-top:12px;font-weight:600">Avisos (${ui.importWarnings.length})</p><div class="small muted" style="max-height:220px;overflow:auto">${ui.importWarnings.slice(0,30).map(w=>`<div style="padding:4px 0;border-bottom:1px solid var(--line)">${esc(w)}</div>`).join('')}${ui.importWarnings.length>30?`<div style="padding:4px 0">+ ${ui.importWarnings.length-30} outro(s) aviso(s)</div>`:''}</div>`}
    if(!c.total){h+=`<p class="small muted" style="margin-top:10px">Nenhuma linha válida encontrada para importar.</p>`}
    h+=`<div class="row" style="gap:10px;margin-top:14px"><button class="btn sec grow" data-act="cancelimport">Cancelar</button><button class="btn block grow" data-act="confirmimport" ${c.total?'':'disabled'}>Importar ${c.total} lançamento${c.total===1?'':'s'}</button></div></div>`;
  }
  h+=`<p class="disc">A importação não substitui uma revisão manual: confira os lançamentos importados em Lançamentos antes de considerar os números definitivos.</p></div>`;
  return h;
}


function applyTheme(){
  const t=S.theme||'auto';
  if(t==='auto')document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
  const dark=t==='dark'||(t==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  const m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute('content',dark?'#0F1B23':'#FAF6F0');
}

    <div class="grid2"><div><label class="f" for="c2v">Custo variável por unidade (R$)</label><input class="in" id="c2v" data-calc inputmode="decimal" value="${V('c2v')}" placeholder="Ex.: 40"></div><div><label class="f" for="c2q">Vendas estimadas por mês</label><input class="in" id="c2q" data-calc inputmode="decimal" value="${V('c2q')}" placeholder="Ex.: 50"></div></div>

function glossHTML(){
  const q=ui.gq.trim().toLowerCase();let out='';
  GLOSS.forEach(([cat,terms])=>{
    const f=terms.filter(t=>!q||t[0].toLowerCase().includes(q)||t[1].toLowerCase().includes(q));
    if(!f.length)return;
    out+=`<h2 class="h-card" style="margin:18px 0 2px">${esc(cat)}</h2>`+f.map(t=>`<details class="term" ${q?'open':''}><summary>${esc(t[0])}</summary><p>${esc(t[1])}</p>${t[2]?`<div class="formula">${esc(t[2])}</div>`:''}</details>`).join('');
  });
  return out||`<div class="empty">Nenhum termo encontrado.</div>`;
}
function calcs(){
  const n=id=>parseNum(ui.cv[id]);const r1=$('#r1'),r2=$('#r2'),r3=$('#r3');
  if(r1){
    const M=n('c1m'),CF=n('c1f'),I=(n('c1i')||0)/100,V=(n('c1v')||0)/100;
    if(isNaN(M)||isNaN(CF)){r1.innerHTML=`<div class="muted small">Preencha a meta de pró-labore e os custos fixos.</div>`}
    else if(I+V>=1){r1.innerHTML=`<div class="neg small">Impostos e custos variáveis somam 100% ou mais. Revise os percentuais.</div>`}
    else{const F=(M+CF)/(1-I-V);const parts=[['Pró-labore',M,'var(--pri)'],['Custos fixos',CF,'var(--sage-d)'],['Impostos',F*I,'var(--terra-m)'],['Custos variáveis',F*V,'var(--terra-d)']];
      r1.innerHTML=`<div class="kpi wide"><small>Faturamento necessário por mês</small><b>${brl(F)}</b></div><div style="display:flex;height:12px;border-radius:99px;overflow:hidden;margin:14px 0 8px">${parts.map(p=>`<i style="width:${p[1]/F*100}%;background:${p[2]}"></i>`).join('')}</div><div class="small">${parts.map(p=>`<div class="row between" style="padding:2px 0"><span><span class="dot" style="background:${p[2]}"></span>${p[0]}</span><b>${brl(p[1])}</b></div>`).join('')}</div>`}
  }
  if(r2){
    const CV=n('c2v'),CF=n('c2f'),Q=n('c2q'),I=(n('c2i')||0)/100,Mg=(n('c2m')||0)/100;
    if(isNaN(CV)||isNaN(CF)||isNaN(Q)){r2.innerHTML=`<div class="muted small">Preencha custo variável, custos fixos e vendas estimadas.</div>`}
    else if(Q<=0){r2.innerHTML=`<div class="neg small">Informe uma quantidade de vendas maior que zero.</div>`}
    else if(I+Mg>=1){r2.innerHTML=`<div class="neg small">Impostos e margem somam 100% ou mais. Revise os percentuais.</div>`}
    else{const cfu=CF/Q,base=CV+cfu;const pmin=base/(1-I),prec=base/(1-I-Mg);
      r2.innerHTML=`<div class="kpis" style="margin:0"><div class="kpi"><small>Preço mínimo</small><b>${brl(pmin)}</b></div><div class="kpi"><small>Preço recomendado</small><b>${brl(prec)}</b></div></div><p class="small muted" style="margin:10px 0 0">Custo fixo por unidade: ${brl(cfu)}. Abaixo do preço mínimo, cada venda dá prejuízo.</p>`}
  }
  if(r3){
    const R=n('c3r'),T=n('c3t'),per=ui.cv.c3p==='aa'?'aa':'am';
    if(isNaN(R)||isNaN(T)){r3.innerHTML=`<div class="muted small">Preencha a renda desejada e o rendimento esperado.</div>`}
    else if(R<=0){r3.innerHTML=`<div class="neg small">Informe uma renda maior que zero.</div>`}
    else if(T<=0){r3.innerHTML=`<div class="neg small">O rendimento esperado deve ser maior que zero.</div>`}
    else{
      const tm=per==='aa'?(Math.pow(1+T/100,1/12)-1)*100:T;
      const capital=R/(tm/100);
      r3.innerHTML=`<div class="kpi wide"><small>Valor necessário investido</small><b>${brl(capital)}</b></div><p class="small muted" style="margin-top:10px">Com um rendimento de ${per==='aa'?pct1(T)+' ao ano (equivalente a '+pct1(tm)+' ao mês)':pct1(T)+' ao mês'}, esse capital geraria cerca de ${brl(capital*tm/100)} por mês, sem consumir o valor investido.</p>`;
    }
  }
}

/* ---------- render ---------- */
const VIEWS={home:viewHome,planner:viewPlannerTab,invest:viewInvestTab,controle:viewControle,tools:viewTools};
function render(top){
  let body;
  if(ui.page==='perfil')body=viewPerfil();
  else if(ui.page==='orc')body=viewOrc();
  else if(ui.page==='cats')body=viewCats();
  else if(ui.page==='prods')body=viewProds();
  else if(ui.page==='invs')body=viewInvs();
  else if(ui.page==='contas')body=viewContas();
  else if(ui.page==='import')body=viewImport();
  else if(ui.page==='goal')body=viewGoalForm();
  else if(ui.reader!=null)body=viewReader();
  else body=header()+'<main>'+VIEWS[ui.tab]()+'</main>'+tabbar();
  $('#app').innerHTML=body+sheetHTML();
  if(top)window.scrollTo(0,0);
  if(ui.page==='orc')budgetTotals();
  if(ui.sheet==='entry'){entryToggle();einvSync()}
  if(ui.sheet==='invrec')invPreview();
  if(ui.reader!=null&&!ui.page)updatePlayer();
  if(ui.tab==='tools'&&ui.reader==null&&!ui.page){calcs()}
}
function setTab(t){ttsStop();ui.reader=null;ui.page=null;ui.tab=t;ui.del=null;
  render(true)}

/* ---------- eventos ---------- */
document.addEventListener('click',function(ev){
  const el=ev.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,v=el.dataset.v;
  if(act==='closesheet'){if(ev.target.closest('[data-stop]')&&!ev.target.closest('button[data-act="closesheet"]'))return;ui.sheet=null;ui.editEntry=null;ui.markEntry=null;render();return}
  if(el.closest('[data-stop]')&&act!=='saveentry'&&act!=='savebudget'&&act!=='savecaixa'&&act!=='closesheet'){}
  switch(act){
   case 'tab':setTab(v);break;
   case 'openplanner':setTab('planner');break;
   case 'openinv':setTab('invest');break;
   case 'perfil':ui.page='perfil';ui.del=null;render(true);break;
   case 'closeperfil':ui.page=null;ui.del=null;render(true);break;
   case 'signoutapp':if(window.FB&&window.FB.signOutUser)window.FB.signOutUser();break;
   case 'hideinstall':S.hideInstall=true;save();render();break;
   case 'open':{ttsStop();const g=GUIDES.find(x=>x.id===+v);ui.reader=g.id;ui.tab='tools';ui.tools='guias';TTS.blocks=ttsBlocks(g);TTS.idx=0;render(true);break}
   case 'closeread':ttsStop();ui.reader=null;render(true);break;
   case 'toggleread':markRead(ui.reader,!S.read[ui.reader]);break;
   case 'pplay':if(TTS.playing)ttsPause();else ttsPlay(TTS.idx);break;
   case 'pprev':ttsPlay(Math.max(0,TTS.idx-1));break;
   case 'pnext':ttsPlay(Math.min(TTS.blocks.length-1,TTS.idx+1));break;
   case 'pspeed':{const R=[1,1.25,1.5,0.85];TTS.rate=R[(R.indexOf(TTS.rate)+1)%R.length];if(TTS.playing)ttsPlay(TTS.idx);else updatePlayer();break}
   case 'seek':if(TTS.ok)ttsPlay(+v);break;
   case 'ans':{S.diag.answers[+el.dataset.q]=+el.dataset.v;save();render();break}
   case 'dsec':ui.diagSec=+v;render(true);break;
   case 'finish':{const a=S.diag.answers;S.diag.history.push({date:todayISO(),score:diagScore(a),secs:secScores(a)});save();ui.diagMode='result';render(true);break}
   case 'redo':S.diag.answers=Array(15).fill(null);save();ui.diagMode='quiz';ui.diagSec=0;render(true);break;
   case 'gloss':ui.tools='gloss';setTab('tools');break;
   case 'tools':{ttsStop();ui.reader=null;ui.page=null;ui.del=null;ui.tab='tools';ui.tools=v;if(v==='diag'){const all=S.diag.answers.every(a=>a!==null);if(all&&S.diag.history.length){ui.diagMode='result'}else{ui.diagMode='quiz';const i=S.diag.answers.findIndex(a=>a===null);ui.diagSec=i<0?0:Math.floor(i/3)}}render(true);break}
   case 'fintab':ui.finTab=v;ui.del=null;render();break;
   case 'ctx':ui.ctx=v;ui.del=null;ui.lancConta='';render();break;
   case 'sheet':ui.sheet=v;render();break;
   case 'editentry':ui.editEntry=+v;ui.sheet='entry';render();break;
   case 'markpaid':ui.markEntry=+v;ui.sheet='markpaid';render();break;
   case 'unmarkpaid':{const F=S.fin[ui.ctx],e=F.entries.find(x=>x.id===+v);if(e){e.pago=false;save();render();toast('Marcado como em aberto')}break}
   case 'confirmpaid':{
     const F=S.fin[ui.ctx],e=F.entries.find(x=>x.id===ui.markEntry),err=$('#mp_err');
     const date=$('#mp_date').value;
     if(!date){err.textContent='Informe a data.';break}
     if(e){e.pago=true;e.date=date;const conta=$('#mp_conta')?$('#mp_conta').value:'';if(conta)e.conta=conta}
     save();ui.sheet=null;ui.markEntry=null;render();toast('Lançamento atualizado');break}
   case 'del':{const id=+v;if(ui.del===id){const F=S.fin[ui.ctx];const ent=F.entries.find(e=>e.id===id);
     if(ent&&ent.fromRec)F.invRecs=F.invRecs.filter(r=>r.id!==ent.fromRec);
     if(ent&&ent.xferId){const xid=ent.xferId;['PJ','PF'].forEach(c=>{S.fin[c].entries=S.fin[c].entries.filter(e=>e.xferId!==xid)});save();ui.del=null;toast('Transferência excluída dos dois lados');render();break}
     F.entries=F.entries.filter(e=>e.id!==id);save();ui.del=null;toast(ent&&ent.fromRec?'Lançamento e resgate excluídos':'Lançamento excluído')}else ui.del=id;render();break}
   case 'saveentry':saveEntry();break;
   case 'orc':ui.bY=ui.year;ui.bM=ui.period==='all'?new Date().getMonth():+ui.period;ui.confirm=null;ui.page='orc';render(true);break;
   case 'bnav':{ui.bM+=+v;if(ui.bM<0){ui.bM=11;ui.bY--}if(ui.bM>11){ui.bM=0;ui.bY++}ui.confirm=null;render();break}
   case 'copyprev':case 'copynext':case 'clearm':budgetAction(act);break;
   case 'plnscope':ui.plnScope=v;render();break;
   case 'newgoal':ui.editGoal=null;ui.page='goal';ui.del=null;render(true);break;
   case 'editgoal':ui.editGoal=v;ui.page='goal';ui.del=null;render(true);break;
   case 'savegoal':saveGoal();break;
   case 'delgoal':{if(ui.del!=='goal:'+v){ui.del='goal:'+v;render();break}S.goals=S.goals.filter(g=>g.id!==v);S.fin.PJ.entries.forEach(e=>{if(e.goals)e.goals=e.goals.filter(a=>a.id!==v)});S.fin.PF.entries.forEach(e=>{if(e.goals)e.goals=e.goals.filter(a=>a.id!==v)});ui.del=null;ui.page=null;save();render(true);toast('Objetivo excluído');break}
   case 'invscope':ui.invScope=v;ui.invTipo='ALL';render();break;
   case 'invtipo':ui.invTipo=v;render();break;
   case 'contas':ui.sheet=null;ui.del=null;ui.page='contas';render(true);break;
   case 'import':ui.sheet=null;ui.del=null;ui.importRows=null;ui.importWarnings=null;ui.importCounts=null;ui.importError=null;ui.page='import';render(true);break;
   case 'downloadtemplate':downloadTemplateCSV();break;
   case 'cancelimport':ui.importRows=null;ui.importWarnings=null;ui.importCounts=null;render();break;
   case 'confirmimport':confirmImport();break;
   case 'verlanc':{ui.ctx=el.dataset.c;ui.lancConta=v;ui.finTab='lanc';ui.page=null;ui.tab='controle';render(true);break}
   case 'savetransfer':saveTransfer();break;
   case 'saverecur':saveRecur();break;
   case 'addacc':{const c=v,n=$('#na_n_'+c).value.trim();if(!n){toast('Digite o nome da conta ou cartão');break}
     const tipo=$('#na_t_'+c).value,a={id:uid(),n,tipo};const banco=$('#na_b_'+c).value.trim();if(banco)a.banco=banco;
     if(tipo==='cartao'){a.bandeira=$('#na_bd_'+c).value;const vd=parseInt($('#na_vd_'+c).value,10);if(vd>=1&&vd<=31)a.vencDia=vd;const md=parseInt($('#na_md_'+c).value,10);if(md>=1&&md<=31)a.melhorDia=md}
     else{const s=parseNum($('#na_s_'+c).value);if(s!==0&&!isNaN(s)){a.saldoIni=s;a.dataIni=$('#na_d_'+c).value||todayISO()}}
     S.fin[c].accounts.push(a);save();render();toast('Cadastrado');break}
   case 'delacc':{const c=el.dataset.c,k='acc:'+c+v;if(ui.del!==k){ui.del=k;render();break}
     if(accUsed(c,v)){S.fin[c].accounts.find(a=>a.id===v).arch=true;toast('Arquivado: continua nos relatórios')}else{S.fin[c].accounts=S.fin[c].accounts.filter(a=>a.id!==v)}
     ui.del=null;save();render();break}
   case 'unacc':{const a=S.fin[el.dataset.c].accounts.find(x=>x.id===v);if(a)delete a.arch;save();render();break}
   case 'invs':ui.sheet=null;ui.del=null;ui.page='invs';render(true);break;
   case 'invrec':ui.invPre={key:v||'',tipo:el.dataset.k||'saldo'};ui.sheet='invrec';render();break;
   case 'saveinvrec':saveInvRec();break;
   case 'delrec':{if(ui.del!=='rec:'+v){ui.del='rec:'+v;render();break}const F=S.fin[el.dataset.c];const rc=F.invRecs.find(r=>r.id===v);if(rc&&rc.entryId)F.entries=F.entries.filter(e=>e.id!==rc.entryId);F.invRecs=F.invRecs.filter(r=>r.id!==v);ui.del=null;save();render();toast(rc&&rc.entryId?(rc.tipo==='div'?'Dividendo e receita excluídos':'Resgate e receita excluídos'):'Registro excluído');break}
   case 'addtipo':{const n=$('#nt_n').value.trim();if(!n){toast('Digite o nome do tipo');break}if(S.invTipos.some(t=>t.toLowerCase()===n.toLowerCase())){toast('Esse tipo já existe');break}S.invTipos.push(n);save();render();break}
   case 'deltipo':{if(ui.del!=='tipo:'+v){ui.del='tipo:'+v;render();break}S.invTipos=S.invTipos.filter(t=>t!==v);ui.del=null;save();render();break}

function saveInvRec(){
  const err=$('#ir_err'),key=$('#ir_inv').value.split('|'),ctx=key[0],id=key[1]||'';
  const v=parseNum($('#ir_val').value),tipo=$('#ir_tipo').value,date=$('#ir_date').value,F=S.fin[ctx];
  if(isNaN(v)){err.textContent='Informe o valor.';return}
  if(!date){err.textContent='Informe a data.';return}
  if(tipo==='saldo'){
    if(v<0){err.textContent='O saldo não pode ser negativo.';return}
    if(date>todayISO()){err.textContent='O saldo deve ter data de hoje ou anterior.';return}
    F.invRecs.push({id:uid(),inv:id,date,tipo:'saldo',valor:v});save();ui.sheet=null;render();toast('Saldo registrado e rendimento calculado');return;
  }
  if(tipo==='rend'){
    if(v===0){err.textContent='Informe um valor diferente de zero.';return}
    F.invRecs.push({id:uid(),inv:id,date,tipo:'rend',valor:v});save();ui.sheet=null;render();toast('Rendimento registrado');return;
  }
  if(tipo==='div'){
    if(v<=0){err.textContent='Informe um valor de dividendo maior que zero.';return}
    const did=uid(),deid=Date.now(),dcat=dividCat(ctx),dnm=invFind(ctx,id).n;
    F.invRecs.push({id:did,inv:id,date,tipo:'div',valor:v,entryId:deid});
    F.entries.push({id:deid,date,cat:dcat,desc:'Dividendos · '+dnm,valor:v,fv:'Variável',pa:1,pt:1,qtd:1,fromRec:did,pago:true});
    save();ui.sheet=null;render();toast('Dividendo lançado como receita '+(ctx==='PJ'?'no Negócio (PJ)':'no Pessoal (PF)'));return;
  }
  if(v<=0){err.textContent='O resgate deve ser maior que zero.';return}
  const rid=uid(),eid=Date.now(),cat=resgateCat(ctx),invObj=F.invs.find(i=>i.id===id)||{id,qtd:0,preco:0},nm=invFind(ctx,id).n;
  const qv=parseNum($('#ir_qv')?$('#ir_qv').value:'')||0,taxas=parseNum($('#ir_taxas')?$('#ir_taxas').value:'')||0;
  let ganho,custoVend;
  if(qv>0){const pu=invPurchases(ctx,invObj);if(pu.avgPreco!==null){custoVend=Math.round(qv*pu.avgPreco*100)/100;ganho=Math.round((v-taxas-custoVend)*100)/100}}
  F.invRecs.push({id:rid,inv:id,date,tipo:'resg',valor:v,entryId:eid,qtdVend:qv>0?qv:undefined,taxas:taxas>0?taxas:undefined,ganho,custoVend});
  F.entries.push({id:eid,date,cat,desc:'Resgate · '+nm,valor:v,fv:'Variável',pa:1,pt:1,qtd:1,fromRec:rid,pago:true});
  save();ui.sheet=null;render();toast(ganho!==undefined?'Resgate lançado · ganho de capital '+brl(ganho):'Resgate lançado como receita '+(ctx==='PJ'?'no Negócio (PJ)':'no Pessoal (PF)'));
}

function saveGoal(){
  const err=$('#gf_err'),n=$('#gf_n').value.trim();
  const valor=parseNum($('#gf_v').value),apo=parseNum($('#gf_apo').value)||0,tx=parseNum($('#gf_tx').value);
  const ini=parseNum($('#gf_ini').value)||0,dataIni=$('#gf_di').value||todayISO(),iniDate=$('#gf_ind').value||dataIni;
  const dataAlvo=$('#gf_al').value||'';
  if(!n){err.textContent='Dê um nome ao objetivo.';return}
  if(!(valor>0)){err.textContent='Informe o valor do objetivo.';return}
  if(isNaN(tx)||tx<0){err.textContent='Informe a taxa de juros estimada.';return}
  const data={n,ctx:$('#gf_c').value,valor,aporte:apo,dataIni,taxa:tx,taxaPer:$('#gf_tp').value,ini,iniDate,dataAlvo};
  if(ui.editGoal){const g=S.goals.find(x=>x.id===ui.editGoal);Object.assign(g,data)}
  else S.goals.push(Object.assign({id:uid()},data));
  save();ui.page=null;render(true);toast('Objetivo salvo');
}
function saveEntry(){
  const F=S.fin[ui.ctx],err=$('#e_err'),editing=!!ui.editEntry;
  const cat=$('#e_cat').value,val=parseNum($('#e_val').value),date=$('#e_date').value;
  if(!cat){err.textContent='Crie ao menos uma categoria antes de lançar.';return}
  if(!(val>0)){err.textContent='Informe um valor maior que zero.';return}
  if(!date){err.textContent='Informe a data.';return}
  const desc=$('#e_desc').value.trim(),fv=$('#e_fv').value;
  let pa=1,pt=1;
  if(!editing){pa=parseInt($('#e_pa').value,10)||1;pt=parseInt($('#e_pt').value,10)||1;if(pt<1)pt=1;if(pa<1)pa=1;if(pa>pt)pt=pa}
  else{const ex=F.entries.find(e=>e.id===ui.editEntry);if(ex){pa=ex.pa||1;pt=ex.pt||1}}
  const gen=!editing&&$('#e_gen').checked&&pt>pa;
  const conta=$('#e_conta')?$('#e_conta').value:'';
  const isR=catOf(ui.ctx,cat).t==='R';const inv=(catOf(ui.ctx,cat).kind==='res'&&$('#e_inv'))?$('#e_inv').value:'';const prod=(isR&&ui.ctx==='PJ'&&$('#e_prod'))?$('#e_prod').value:'';const qtd=(isR&&ui.ctx==='PJ'&&$('#e_qtd'))?(parseNum($('#e_qtd').value)||1):1;
  let invQtd,invPreco;
  if(inv){
    const iq=parseNum($('#e_iqtd')?$('#e_iqtd').value:''),ip=parseNum($('#e_ipreco')?$('#e_ipreco').value:'');
    if(iq>0)invQtd=iq;if(ip>0)invPreco=ip;
    const idi=parseNum($('#e_idi')?$('#e_idi').value:''),ivenc=$('#e_ivenc')?$('#e_ivenc').value:'';
    const ivObj=(S.fin[ui.ctx].invs||[]).find(x=>x.id===inv);
    if(ivObj){if(idi>0)ivObj.diPct=idi;if(ivenc)ivObj.venc=ivenc}
  }
  const goals=[];document.querySelectorAll('[data-goalpct]').forEach(el=>{const n=parseNum(el.value);if(n>0)goals.push({id:el.dataset.id,pct:n})});
  if(!goals.length&&inv){const iv=(S.fin[ui.ctx].invs||[]).find(x=>x.id===inv);if(iv&&iv.goals&&iv.goals.length){const valid=iv.goals.filter(a=>S.goals.some(g=>g.id===a.id));const tot=valid.reduce((a,x)=>a+x.pct,0);const scale=tot>100?100/tot:1;valid.forEach(a=>{const p=Math.round(a.pct*scale);if(p>0)goals.push({id:a.id,pct:p})})}}
  const gsum=goals.reduce((a,x)=>a+x.pct,0);if(gsum>100){err.textContent='A soma dos objetivos não pode passar de 100%.';return}
  if(editing){
    const ex=F.entries.find(e=>e.id===ui.editEntry);
    if(ex){
      const scope=$('#e_scope')?$('#e_scope').value:'one',origDate=ex.date,origRec=ex.recId;
      Object.assign(ex,{date,cat,desc,valor:val,fv,prod:prod||undefined,qtd,inv:inv||undefined,invQtd:invQtd||undefined,invPreco:invPreco||undefined,goals:goals.length?goals:undefined,conta:conta||undefined});
      let n=0;
      if(scope==='forward'&&origRec){F.entries.forEach(e2=>{if(e2.recId===origRec&&e2.id!==ex.id&&e2.date>=origDate){e2.cat=cat;e2.desc=desc;e2.valor=val;e2.fv=fv;e2.conta=conta||undefined;n++}})}
      save();ui.sheet=null;ui.editEntry=null;render();toast(n>0?`Lançamento e mais ${n} futuro(s) atualizados`:'Lançamento atualizado');return;
    }
    ui.sheet=null;ui.editEntry=null;render();return;
  }
  const base=Date.now();
  F.entries.push({id:base,date,cat,desc,valor:val,fv,pa,pt,prod:prod||undefined,qtd,inv:inv||undefined,invQtd:invQtd||undefined,invPreco:invPreco||undefined,goals:goals.length?goals:undefined,conta:conta||undefined,pago:date<=todayISO()});
  if(gen){for(let k=1;k<=pt-pa;k++){const d2=addMonths(date,k);F.entries.push({id:base+k,date:d2,cat,desc,valor:val,fv,pa:pa+k,pt,prod:prod||undefined,qtd,inv:inv||undefined,goals:goals.length?goals:undefined,conta:conta||undefined,pago:d2<=todayISO()})}}
  save();ui.sheet=null;render();toast(gen?`Lançamento e ${pt-pa} parcela(s) salvos`:'Lançamento salvo');
}

    </div>`;
  }else if(view==='unauthorized'){

      <img src="${LOGO}" alt="Fortera" style="height:46px">
      <h1 class="h-page" style="margin:0">Acesso não liberado</h1>
      <p class="sub" style="max-width:340px">O e-mail <b>${esc(extra||'')}</b> ainda não tem acesso ao Fortera Controle. Se você já comprou o Kit Raio-X, aguarde alguns minutos ou fale com a gente.</p>
      <button class="btn sec" data-gate="signout">Sair e tentar outra conta</button>
    </div>`;
  }else if(view==='error'){
    app.innerHTML=`<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px">
      <img src="${LOGO}" alt="Fortera" style="height:42px">
      <p class="sub" style="max-width:320px">Não foi possível conectar. Verifique sua internet e tente novamente.</p>
      <button class="btn" data-gate="retry">Tentar de novo</button>
    </div>`;
  }
}
document.addEventListener('click',function(ev){
  const g=ev.target.closest('[data-gate]');if(!g)return;
  const act=g.dataset.gate;
  if(act==='signin'){renderGate('loading');window.FB.signIn().catch(()=>{renderGate('error')})}
  else if(act==='signout'){window.FB.signOutUser()}
  else if(act==='retry'){location.reload()}
});
function startAuthFlow(){
  if(window.FB===null){renderGate('error');return}
  if(!window.FB){bootApp();return}
  renderGate('loading');
  window.FB.onAuth(async(user)=>{
    if(!user){cloudUid=null;authEmail='';renderGate('signedout');return}
    renderGate('loading');
    try{
      const ok=await window.FB.checkAuthorized(user.email||'');
      if(!ok){cloudUid=null;renderGate('unauthorized',user.email);return}
      cloudUid=user.uid;
      authEmail=user.email||'';
      const cloud=await window.FB.loadState(user.uid);
      if(cloud){try{S=normalize(JSON.parse(cloud))}catch(e){}}
      else{save()}
      applyTheme();
      render(true);
    }catch(e){renderGate('error')}
  });
}
function bootApp(){
  if(window.FB===undefined){window.addEventListener('fb-ready',bootApp,{once:true});return}
  startAuthFlow();
}
applyTheme();
renderGate('loading');
bootApp();
setTimeout(()=>{if(window.FB===undefined)renderGate('error')},10000);
})();
</script>
</body>
</html>
